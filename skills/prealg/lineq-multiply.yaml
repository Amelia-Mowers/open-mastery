id: prealg.lineq.multiply
name: Solve x/a = b and -x = b using the Multiplication Property of Equality
preamble:
  plain: "Sometimes x has been divided by a number, or flipped negative. You'll learn to undo that by multiplying both sides by the same thing."
  vocab:
    - { term: Multiplication Property of Equality, meaning: "multiply both sides of an equation by the same number and it stays true" }
standards: [CCSS.MATH.CONTENT.6.EE.B.7]
source: { book: openstax-prealgebra-2e, section: "8.2" }
bkt_defaults: { L0: 0.3, T: 0.15, S: 0.1, G: 0.2 }
fluency: false
instruction:
  - prealg.lineq.multiply.exp-tape
  - prealg.lineq.multiply.exp-balance
  - prealg.lineq.multiply.exp-numberline
faded_examples: [prealg.lineq.multiply.f01]
