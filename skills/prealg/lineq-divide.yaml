id: prealg.lineq.divide
name: Solve ax = b using the Division Property of Equality
preamble:
  plain: "A number times x gives you a total. You'll learn to find x by undoing the multiplication — dividing both sides by the same number."
  vocab:
    - { term: equation, meaning: "a math sentence saying two things are equal" }
    - { term: Division Property of Equality, meaning: "divide both sides of an equation by the same number and it stays true" }
