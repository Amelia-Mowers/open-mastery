id: prealg.lineq.reciprocal.001
skills: [prealg.lineq.reciprocal]
difficulty: 1
representation: balance-scale
params: { p: 2, q: 3, b: 18, variable: x }
generator:
  q: { int: [2, 9] }
  p: { int: [2, 9], coprime: q, distinct: q }
  b: { mult_of: p, range: [10, 60] }
widget: { type: equation-input, config: { stem: "Solve: {p}/{q} {variable} = {b}." } }
answer: { type: expr, value: "{variable} = {q*b/p}", equivalence: symbolic }
viz: { template: balance-scale, bind: { left: "{p}/{q} {variable}", right: "{b}" } }
hints:
  - "What is the reciprocal of {p}/{q}?"
  - "Multiply both sides by {q}/{p}."
source: { book: openstax-prealgebra-2e, section: "8.2" }
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
