id: prealg.lineq.negate.002
skills: [prealg.lineq.negate]
difficulty: 2
representation: opposite-flip
params: { b: -8, variable: k }
generator: { b: { int: [-20, -2] } }
widget:
  type: number-line
  config:
    stem: "Solve: -{variable} = {b}.  Move the dot to {variable}."
    min: "{-2*abs(b)}"
