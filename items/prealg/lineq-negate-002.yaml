answer: { type: expr, value: "{variable} = {-b}", equivalence: symbolic }
hints:
  - "-{variable} means the opposite of {variable}."
  - "The opposite of {b} is {-b}."
source: { book: openstax-prealgebra-2e, section: "8.2" }
