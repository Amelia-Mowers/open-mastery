id: g7.rp.unit-rate-frac.002
skills: [g7.rp.unit-rate-frac]
difficulty: 2
representation: double-number-line
params: { p: 3, q: 4, r: 8 }
generator: { q: { int: [2, 6] }, p: { int: [1, 5], coprime: q }, r: { mult_of: q, range: [7, 12] } }
widget: { type: numeric-input, config: { stem: "A faucet fills {p}/{q} of a tub in 1/{r} of a minute. How many tubs does it fill per minute?" } }
answer: { type: expr, value: "{p*r/q}", integer: true }
hints:
  - "A whole minute is {r} chunks of 1/{r} minute."
  - "{p}/{q} × {r} = {p*r/q} tubs each minute."
source: { book: ccss-rp-progression, section: "7.RP.A.1" }
verify: "{answer * q == p * r}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
