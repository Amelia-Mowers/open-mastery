id: g7.rp.test-proportional.002
skills: [g7.rp.test-proportional]
difficulty: 2
representation: ratio-table
params: { k: 3, a: 2, c: 5, d: 2 }
generator: { k: { int: [2, 9] }, a: { int: [2, 4] }, c: { int: [5, 9] }, d: { int: [1, 5] } }
widget:
  type: choice
  config:
    stem: "x: {a} → y: {a*k}.   x: {c} → y: {c*k+d}.   Is y proportional to x?"
    options:
      - { key: "yes", label: "Yes — y ÷ x is the same in every row" }
      - { key: "no", label: "No — the rows don't share one multiplier" }
answer: { type: choice, value: "no" }
hints:
  - "Divide y by x in each row. Do you get the same number both times?"
  - "{a*k} ÷ {a} = {k}, but {c*k+d} ÷ {c} is NOT {k} — the pattern breaks."
source: { book: ccss-rp-progression, section: "7.RP.A.2a" }
verify: "{(c*k+d) * a != a*k * c}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
