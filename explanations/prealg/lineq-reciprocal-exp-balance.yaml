id: prealg.lineq.reciprocal.exp-balance
skill: prealg.lineq.reciprocal
representation: balance-scale
widget: balance-scale
params_from: item
timeline:
  - { t: 0, patch: { left: "{p}/{q} {variable}", right: "{b}" }, caption: "The scale is balanced: {p}/{q} {variable} equals {b}." }
  - { t: 3.5, patch: { highlight: left.coef }, caption: "A fraction does two jobs at once: it multiplies {variable} by {p} AND divides by {q}. Undo them one at a time." }
  - { t: 7.5, patch: { op: multiply, by: "{q}", highlight: null }, caption: "First multiply both sides by {q} — that clears the divide." }
  - { t: 11, patch: { left: "{p}{variable}", right: "{q*b}", op: null }, caption: "Now it reads {p}{variable} = {q*b} — a problem you already know how to solve." }
  - { t: 14.5, patch: { op: divide, by: "{p}" }, caption: "Divide both sides by {p}." }
  - { t: 18, patch: { left: "{variable}", right: "{q*b/p}", op: null }, caption: "{variable} = {q*b/p}." }
  - { t: 20, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
