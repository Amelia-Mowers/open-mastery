id: prealg.lineq.multiply.exp-balance
skill: prealg.lineq.multiply
representation: balance-scale
widget: balance-scale
params_from: item
timeline:
  - { t: 0, patch: { left: "{variable}/{a}", right: "{b}" }, caption: "The scale is balanced: {variable}/{a} equals {b}." }
  - { t: 3, patch: { highlight: left }, caption: "{variable} is divided by {a}. Undo division by multiplying." }
  - { t: 6, patch: { op: multiply, by: "{a}" }, caption: "Multiply both sides by {a} — the scale stays balanced." }
  - { t: 9, patch: { left: "{variable}", right: "{a*b}", op: null, highlight: null }, caption: "{variable} = {a*b}." }
  - { t: 11, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
