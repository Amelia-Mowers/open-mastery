id: prealg.lineq.reciprocal.exp-numberline
skill: prealg.lineq.reciprocal
representation: number-line
widget: number-line
params_from: item
timeline:
  - { t: 0, patch: { min: 0, max: "{q*b/p}", step: "{b/p}" }, caption: "{p}/{q} {variable} = {b}: {p} of the {q} equal parts of {variable} total {b}." }
  - { t: 3.5, patch: { highlight: ["{b/p}"], marker: "{b/p}" }, caption: "One part is {b} ÷ {p} = {b/p}." }
  - { t: 7, patch: { marker: "{q*b/p}" }, caption: "{variable} has {q} parts: {q} × {b/p} = {q*b/p}." }
  - { t: 9, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
