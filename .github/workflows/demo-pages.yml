# Deploys the backend-in-the-browser demo to GitHub Pages.
# Assumes the repository root is the open_mastery workspace (schema/, cairn/,
# curriculum/ as sibling directories). Enable Pages with "GitHub Actions" as
# the source in the repo settings.
name: demo-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: schema
      - run: npm ci
        working-directory: cairn
      - run: npm run build:demo
        working-directory: cairn
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cairn/dist-demo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
