id: g7.rp.constant-k
name: Find the constant of proportionality
short: "Find the number that links x and y"
preamble:
  plain: "In a proportional relationship, y divided by x gives the same number every single time. That number — the unit rate — is called k, the constant of proportionality."
  vocab:
    - { term: proportional, meaning: "Two quantities where one is always the same multiple of the other." }
    - { term: constant of proportionality, meaning: "The number k that every x is multiplied by to get y." }
standards: [CCSS.MATH.CONTENT.7.RP.A.2.B]
source: { book: ccss-rp-progression, section: "7.RP.A.2b" }
bkt_defaults: { L0: 0.2, T: 0.08, S: 0.12, G: 0.25 }
fluency: false
prereqs: [g6.rp.unit-rate]
