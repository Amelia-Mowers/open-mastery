id: g7.rp.unit-rate-frac
name: Find unit rates from fractions (like 1/2 mile in 1/4 hour)
short: "A rate from a fraction of an hour"
preamble:
  plain: "Sometimes a rate is given for just a fraction of an hour. To find the rate for a full hour, we stretch the fraction of an hour up to a whole hour — and the amount done stretches with it."
