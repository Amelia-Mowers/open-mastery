id: g7.rp.unit-rate-frac
name: Find unit rates from fractions (like 1/2 mile in 1/4 hour)
short: "Speed from a fraction of an hour"
preamble:
  plain: "Half a mile in a quarter of an hour — how fast is that per hour? We stretch the quarter hour up to a whole hour, and stretch the distance along with it."
  vocab:
    - { term: complex fraction, meaning: "A fraction divided by a fraction, like (1/2)/(1/4)." }
