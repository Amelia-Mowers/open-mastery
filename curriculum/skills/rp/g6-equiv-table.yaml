id: g6.rp.equiv-table
name: Make equivalent ratios by scaling both quantities
short: "Grow a ratio without changing it"
preamble:
  plain: "A recipe pairs two amounts — so many cups for so many muffins. Multiply BOTH amounts by the same number and it is still the same recipe, just a bigger batch. The two ratios are equivalent."
  vocab:
    - { term: ratio, meaning: "A pair of numbers that go together, like 3 cups for every 8 muffins." }
    - { term: equivalent ratios, meaning: "Two ratios that describe the same relationship." }
standards: [CCSS.MATH.CONTENT.6.RP.A.3.A]
source: { book: ccss-rp-progression, section: "6.RP.A.3a" }
bkt_defaults: { L0: 0.2, T: 0.08, S: 0.12, G: 0.25 }
fluency: false
prereqs: []
instruction:
  - g6.rp.equiv-table.exp-table
  - g6.rp.equiv-table.exp-dnl
  - g6.rp.equiv-table.exp-worked
