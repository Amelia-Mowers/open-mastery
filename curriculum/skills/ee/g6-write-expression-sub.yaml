id: g6.ee.write-expression-sub
name: Write a subtraction expression from words
short: "Turn \"less than\" words into math"
preamble:
  plain: "A \"less than\" phrase is written back to front: the amount named first is what gets taken away, from whatever comes after it. So in symbols, the second part goes first — and then we subtract."
  vocab:
    - { term: less than, meaning: "\"7 less than 12\" means 12 − 7: start from the 12 and take the 7 away." }
standards: [CCSS.MATH.CONTENT.6.EE.A.2.A]
source: { book: ccss-ee-progression, section: "6.EE.A.2a" }
bkt_defaults: { L0: 0.2, T: 0.08, S: 0.12, G: 0.25 }
fluency: false
prereqs: [g6.ee.write-expression]
instruction:
  - g6.ee.write-expression-sub.exp-worked
