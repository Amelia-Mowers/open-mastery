id: g6.ee.exponents
name: Evaluate whole-number exponents
short: "Powers: a number times itself"
preamble:
  plain: "Sometimes a number is multiplied by itself, and we write that with a small raised number. That little number is a count — it tells you how many times the big number gets used as a factor."
  vocab:
    - { term: exponent, meaning: "The small raised number that tells you how many times to use the base as a factor." }
