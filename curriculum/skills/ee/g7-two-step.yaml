id: g7.ee.two-step
name: Solve two-step equations px + q = r
short: "Two moves to find {variable}"
preamble:
  plain: "Here x is hiding behind two operations: a multiply and an add. We peel them off in reverse — undo the add first, then the multiply — and the equation stays true the whole way."
  vocab:
    - { term: two-step equation, meaning: "An equation that needs two undo moves — the letter was multiplied by something, and then something more was added." }
standards: [CCSS.MATH.CONTENT.7.EE.B.4.A]
source: { book: ccss-ee-progression, section: "7.EE.B.4a" }
bkt_defaults: { L0: 0.2, T: 0.08, S: 0.12, G: 0.25 }
fluency: false
prereqs: [g6.ee.add-solve, prealg.lineq.divide]
instruction:
  - g7.ee.two-step.exp-balance
  - g7.ee.two-step.exp-worked
  - g7.ee.two-step.exp-numberline
