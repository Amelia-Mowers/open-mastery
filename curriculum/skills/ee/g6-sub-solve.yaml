id: g6.ee.sub-solve
name: Solve x − p = q using the Addition Property of Equality
short: "Find x when something was taken away"
preamble:
  plain: "Sometimes the number we want had something taken away from it, and all we can see is what was left. To find it, we add that same amount back to both sides — and the number stands on its own."
  vocab:
    - { term: Addition Property of Equality, meaning: "If you add the same number to both sides of an equation, it stays true." }
# 6.EE.B.7 enumerates x + p = q; this is its inverse-form twin, taught alongside
