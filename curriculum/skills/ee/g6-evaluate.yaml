id: g6.ee.evaluate
name: Evaluate an expression at a value
short: "Plug a number into an expression"
preamble:
  plain: "To evaluate an expression like 3x + 5, we substitute a number for the variable — put it in x's place — and then work out the value."
  vocab:
    - { term: substitute, meaning: "Put a number in the variable's place." }
    - { term: variable, meaning: "A letter that represents a number." }
standards: [CCSS.MATH.CONTENT.6.EE.A.2.C]
source: { book: ccss-ee-progression, section: "6.EE.A.2c" }
bkt_defaults: { L0: 0.2, T: 0.08, S: 0.12, G: 0.25 }
fluency: false
prereqs: []
