id: g6.ee.write-expression
name: Write an expression from words
short: "Turn words into math"
preamble:
  plain: "Words can describe a calculation before we know the number in it. We let a letter stand for that number and write the calculation in symbols — and then it works for every number at once."
  vocab:
    - { term: expression, meaning: "Numbers, letters, and operations — a phrase in math symbols, with no equals sign." }
standards: [CCSS.MATH.CONTENT.6.EE.A.2.A]
source: { book: ccss-ee-progression, section: "6.EE.A.2a" }
bkt_defaults: { L0: 0.2, T: 0.08, S: 0.12, G: 0.25 }
fluency: false
prereqs: [g6.ee.evaluate]
instruction:
