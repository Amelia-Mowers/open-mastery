id: g7.ee.combine-neg
name: Combine like terms when the numbers are subtracted
short: "Gather matching terms with minus signs"
preamble:
  plain: "In 9y − 8 − 3y − 2, the y-terms still go together — and so do the subtracted numbers. Taking away 8 and then 2 is taking away 10 in all."
  vocab:
    - { term: like terms, meaning: "Terms with the same letter part — they can be combined." }
