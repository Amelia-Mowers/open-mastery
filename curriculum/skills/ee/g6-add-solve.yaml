id: g6.ee.add-solve
name: Solve x + p = q using the Subtraction Property of Equality
short: "Find {variable} when something was added"
preamble:
  plain: "An equation says that two sides are equal. Here, a number was added to the variable, and the equation shows the total. To solve it, we find the value of the variable that makes the equation true: subtract that same number from both sides, and the variable stands alone."
  vocab:
    - { term: variable, meaning: "A letter that represents a number." }
    - { term: solution, meaning: "A number that can be used in place of the variable to make the equation true." }
    - { term: Subtraction Property of Equality, meaning: "If you subtract the same number from both sides of an equation, it stays true." }
standards: [CCSS.MATH.CONTENT.6.EE.B.7]
source: { book: ccss-ee-progression, section: "6.EE.B.7" }
bkt_defaults: { L0: 0.2, T: 0.08, S: 0.12, G: 0.25 }
fluency: false
prereqs: []
instruction:
  - g6.ee.add-solve.exp-balance
  - g6.ee.add-solve.exp-worked
  - g6.ee.add-solve.exp-tape
