id: g7.ee.combine
name: Combine like terms to simplify an expression
short: "Gather the matching terms"
preamble:
  plain: "5x + 3 − 2x + 4 has the letter x twice. We gather the x-terms together, gather the plain numbers together — and the expression becomes one short line."
  vocab:
    - { term: like terms, meaning: "Terms with the same letter part — they can be added together." }
standards: [CCSS.MATH.CONTENT.7.EE.A.1]
