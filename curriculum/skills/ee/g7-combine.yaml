id: g7.ee.combine
name: Combine like terms to simplify an expression
short: "Gather the matching terms"
preamble:
  plain: "Sometimes the same letter shows up in an expression more than once. We gather those terms together, gather the plain numbers together — and the expression becomes one short line."
  vocab:
    - { term: like terms, meaning: "Terms with the same letter part — they can be added together." }
