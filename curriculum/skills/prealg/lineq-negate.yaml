id: prealg.lineq.negate
name: Solve -x = b, the opposite of x
short: "Find x from its opposite"
preamble:
  plain: "-x means the OPPOSITE of x. If the opposite of x is 2, then x is the opposite of 2 — one flip and it is solved."
  vocab:
    - { term: opposite, meaning: "the same number on the other side of zero: the opposite of 2 is -2" }
prereqs: [prealg.lineq.multiply]
standards: [CCSS.MATH.CONTENT.6.NS.C.6.A, CCSS.MATH.CONTENT.7.EE.B.4.A]  # 6.EE.B.7 is nonnegative-only; -x = b is opposites (6.NS.C.6a) + rational-coefficient solving
source: { book: openstax-prealgebra-2e, section: "8.2" }
bkt_defaults: { L0: 0.2, T: 0.08, S: 0.12, G: 0.25 }
fluency: false
instruction:
  - prealg.lineq.negate.exp-flip
  - prealg.lineq.negate.exp-worked
  - prealg.lineq.negate.exp-balance
