id: prealg.lineq.reciprocal
name: Solve (p/q)x = b by multiplying by the reciprocal
short: "Find x when a fraction multiplies it"
preamble:
  plain: "When a fraction multiplies x, it does two jobs at once: a multiply and a divide. We can undo them one at a time — or with one move, using the reciprocal."
  vocab:
    - { term: reciprocal, meaning: "A fraction flipped upside down: the reciprocal of 2/3 is 3/2." }
    - { term: coefficient, meaning: "The number multiplying x." }
prereqs: [prealg.lineq.multiply, prealg.lineq.divide]
standards: [CCSS.MATH.CONTENT.6.EE.B.7]  # px = q with NONNEGATIVE rationals — fraction coefficients included
source: { book: openstax-prealgebra-2e, section: "8.2" }
bkt_defaults: { L0: 0.2, T: 0.08, S: 0.12, G: 0.25 }
fluency: false
instruction:
  - prealg.lineq.reciprocal.exp-balance
  - prealg.lineq.reciprocal.exp-shortcut
  - prealg.lineq.reciprocal.exp-numberline
