id: prealg.lineq.divide
name: Solve ax = b using the Division Property of Equality
short: "Find {variable} when it was multiplied"
preamble:
  plain: "Here the variable was multiplied by a number, and the equation shows the result. To find the value of the variable that makes the equation true, we divide both sides by that same number — and the variable stands alone."
  vocab:
    - { term: equation, meaning: "A math sentence saying two things are equal." }
    - { term: Division Property of Equality, meaning: "If you divide both sides of an equation by the same number, it stays true." }
standards: [CCSS.MATH.CONTENT.6.EE.B.7]
source: { book: openstax-prealgebra-2e, section: "8.2" }
bkt_defaults: { L0: 0.2, T: 0.08, S: 0.12, G: 0.25 }
fluency: false
instruction:
