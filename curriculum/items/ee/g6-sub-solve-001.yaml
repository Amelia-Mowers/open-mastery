id: g6.ee.sub-solve.001
skills: [g6.ee.sub-solve]
supersedes: g6.ee.add-solve.002
difficulty: 1
representation: balance-scale
params: { p: 9, d: 12, variable: x }
generator: { p: { int: [2, 30] }, d: { int: [2, 40] } }
widget: { type: equation-input, config: { stem: "Solve: {variable} − {p} = {d}." } }
answer: { type: expr, value: "{variable} = {p+d}", equivalence: symbolic, integer: true }
hints:
  - "What operation undoes subtracting {p}?"
  - "Add {p} to both sides."
source: { book: ccss-ee-progression, section: "6.EE.B.7" }
verify: "{answer - p == d}"
viz: { template: balance-scale, bind: { left: "{variable} - {p}", right: "{d}" } }
