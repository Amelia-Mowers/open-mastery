id: g6.ee.exponents.001
skills: [g6.ee.exponents]
difficulty: 1
representation: area-model
params: { c: 6 }
generator: { c: { int: [3, 12] } }
widget: { type: numeric-input, config: { stem: "Evaluate: {c}²." } }
answer: { type: expr, value: "{c*c}", form: evaluated, integer: true }
misconceptions:
  - id: multiplied-by-two
    when: "{2*c}"
    says: "{c}² means {c} used as a FACTOR twice — {c} × {c} — not {c} × 2."
hints:
  - "{c}² means {c} used as a factor twice."
  - "{c} × {c} = {c*c}."
source: { book: ccss-ee-progression, section: "6.EE.A.1" }
verify: "{answer / c == c}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-27 }
