id: g6.ee.write-expression-sub.002
skills: [g6.ee.write-expression-sub]
difficulty: 2
representation: worked-equation
params: { a: 5, p: 3, variable: k }
generator: { a: { int: [2, 9] }, p: { int: [1, 12] } }
widget: { type: expression-input, config: { stem: "Write an expression: the difference of {a} times a number {variable} and {p}." } }
answer: { type: expr, value: "{a}{variable} - {p}", equivalence: symbolic }
misconceptions:
  - id: subtracted-the-wrong-way
    when: "{p} - {a}{variable}"
    says: "'The difference of {a} times a number and {p}' starts from {a}{variable} and takes {p} away: {a}{variable} − {p}."
  - id: used-p-as-the-coefficient
    when: "{p}{variable} - {a}"
    says: "{a} is what the number is multiplied BY; {p} is what gets taken away. They are swapped here."
hints:
  - "{a} times the number is {a}{variable}."
  - "The difference takes the {p} away after: {a}{variable} − {p}."
source: { book: ccss-ee-progression, section: "6.EE.A.2a" }
verify: "-{p} + {a}*{variable}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-30 }
