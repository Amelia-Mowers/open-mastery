id: g6.ee.cube.001
skills: [g6.ee.cube]
supersedes: g6.ee.exponents.002
difficulty: 1
representation: tape-diagram
params: { n: 4 }
generator: { n: { int: [2, 6] } }
widget: { type: numeric-input, config: { stem: "Evaluate: {n}³." } }
answer: { type: expr, value: "{n*n*n}", form: evaluated, integer: true }
misconceptions:
  - id: multiplied-by-three
    when: "{3*n}"
    says: "{n}³ means {n} used as a FACTOR three times — {n} × {n} × {n} — not {n} × 3."
  - id: squared-instead-of-cubed
    when: "{n*n}"
    says: "That's {n}², two factors. The small 3 asks for one more: {n} × {n} × {n}."
hints:
  - "{n}³ means {n} used as a factor three times."
  - "{n} × {n} = {n*n}, and {n*n} × {n} = {n*n*n}."
source: { book: ccss-ee-progression, section: "6.EE.A.1" }
verify: "{answer / n / n == n}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-27 }
