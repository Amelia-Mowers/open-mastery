id: g6.ee.cube.004
skills: [g6.ee.cube]
difficulty: 3
representation: worked-equation
params: { n: 8 }
generator: { n: { set: [7, 8, 9, 11, 12] } }
widget: { type: numeric-input, config: { stem: "What is the value of {n}³?" } }
answer: { type: expr, value: "{n*n*n}", form: evaluated, integer: true }
misconceptions:
  - id: multiplied-by-three
    when: "{3*n}"
    says: "{n}³ means {n} used as a FACTOR three times — {n} × {n} × {n} — not {n} × 3."
  - id: squared-instead-of-cubed
    when: "{n*n}"
    says: "That's {n}², two factors. The small 3 asks for one more: {n} × {n} × {n}."
hints:
  - "{n}³ is three equal factors of {n} — start with the square."
  - "{n}² = {n*n}, and {n*n} × {n} = {n*n*n}."
source: { book: ccss-ee-progression, section: "6.EE.A.1" }
verify: "{answer / n / n == n}"
review: { status: draft, by: "@claude-fable-5", date: 2026-09-10 }
