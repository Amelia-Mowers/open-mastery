id: g6.ee.write-expression.002
skills: [g6.ee.write-expression]
difficulty: 2
representation: worked-equation
params: { a: 6, p: 4, variable: m }
generator: { a: { int: [2, 9] }, p: { int: [1, 12] } }
widget: { type: expression-input, config: { stem: "Write an expression: the sum of {a} times a number {variable} and {p}." } }
answer: { type: expr, value: "{a}{variable} + {p}", equivalence: symbolic }
misconceptions:
  - id: multiplied-the-sum
    when: "{a}*({variable} + {p})"
    says: "'The sum of {a} times a number and {p}' multiplies FIRST, then adds — {a}{variable}, then + {p}."
  - id: used-p-as-the-coefficient
    when: "{p}{variable} + {a}"
    says: "{a} is what the number is multiplied BY; {p} is what gets added on. They are swapped here."
hints:
  - "{a} times the number is {a}{variable}."
  - "The sum adds the {p} on after: {a}{variable} + {p}."
source: { book: ccss-ee-progression, section: "6.EE.A.2a" }
verify: "{p} + {a}*{variable}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-30 }
