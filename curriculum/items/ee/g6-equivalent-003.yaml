id: g6.ee.equivalent.003
skills: [g6.ee.equivalent]
difficulty: 1
representation: area-model
params: { a: 3, b: 2, variable: x }
generator: { a: { int: [2, 9] }, b: { int: [1, 9] } }
widget:
  type: area-model
  config:
    stem: "{a}({variable} + {b}): fill in the missing piece of area."
    height: "{a}"
    parts: ["{variable}", "{b}"]
    products: ["{a}{variable}", "?"]
answer: { type: expr, value: "{a*b}", integer: true }
misconceptions:
  - id: added-instead-of-multiplied
    when: "{a+b}"
    says: "Each piece of area is a MULTIPLY: this one is {a} rows of {b}, so {a}·{b}."
hints:
  - "The missing piece is {a} tall and {b} wide."
  - "{a} × {b} = {a*b}."
source: { book: ccss-ee-progression, section: "6.EE.A.3" }
verify: "{answer / b == a}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-27 }
