id: g6.ee.equivalent.001
skills: [g6.ee.equivalent]
difficulty: 1
representation: ratio-table
params: { m: 3, n: 2, variable: x }
generator: { m: { int: [2, 9] }, n: { int: [1, 9] } }
widget: { type: term-input, config: { variable: "{variable}", stem: "Expand: {m}({variable} + {n})." } }
answer: { type: expr, value: "{m}{variable} + {m*n}", equivalence: symbolic, form: expanded }
misconceptions:
  - id: distributed-to-first-term-only
    when: "{m}{variable} + {n}"
    says: "The {m} multiplies EVERY part inside: {m}·{variable} AND {m}·{n}. The {n} was left untouched."
hints:
  - "Multiply {m} by EACH part inside the parentheses."
  - "{m}·{variable} + {m}·{n} = {m}{variable} + {m*n}."
source: { book: ccss-ee-progression, section: "6.EE.A.3" }
verify: "{m}*{variable} + {m}*{n}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-27 }
