id: g6.rp.find-whole.001
skills: [g6.rp.find-whole]
difficulty: 1
representation: double-number-line
params: { n: 5, k: 24 }
generator: { n: { set: [2, 4, 5, 10] }, k: { int: [3, 30] } }
widget: { type: numeric-input, config: { stem: "{100/n}% of a number is {k}. What is the number?" } }
answer: { type: expr, value: "{n*k}", form: evaluated, integer: true }
misconceptions:
  - id: answered-the-part
    when: "{k}"
    says: "{k} is the PART you were given. The question asks for the whole — the number that {100/n}% of it makes {k}."
hints:
  - "{100/n}% is the benchmark fraction 1/{n} — {k} is one of {n} equal parts."
  - "All {n} parts: {k} × {n} = {n*k}."
source: { book: ccss-rp-progression, section: "6.RP.A.3c" }
verify: "{(100/n) * answer == k * 100}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-30 }
