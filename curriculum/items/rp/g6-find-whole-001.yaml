id: g6.rp.find-whole.001
skills: [g6.rp.find-whole]
difficulty: 1
representation: double-number-line
params: { m: 4, h: 6 }
generator: { m: { int: [2, 9] }, h: { int: [2, 9] } }
widget: { type: numeric-input, config: { stem: "{10*m}% of a number is {m*h}. What is the number?" } }
answer: { type: expr, value: "{10*h}", form: evaluated, integer: true }
misconceptions:
  - id: answered-the-part
    when: "{m*h}"
    says: "{m*h} is the PART you were given. The question asks for the whole — the number that {10*m}% of it makes {m*h}."
hints:
  - "{10*m}% is {m} tens, so 10% of the number is {m*h} ÷ {m} = {h}."
  - "10% is {h}, and 100% is ten tens: {h} × 10 = {10*h}."
source: { book: ccss-rp-progression, section: "6.RP.A.3c" }
verify: "{10*m * answer == m*h * 100}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-30 }
