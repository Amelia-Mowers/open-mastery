id: g7.rp.test-proportional.004
skills: [g7.rp.test-proportional]
difficulty: 3
representation: double-number-line
params: { k: 3, j: 7, a: 2, c: 6, e: 9 }
generator: { k: { int: [2, 9] }, j: { int: [2, 9], distinct: k }, a: { int: [2, 4] }, c: { int: [5, 7] }, e: { int: [8, 12] } }
widget:
  type: compare-input
  config:
    stem: "Is y proportional to x? Find each pair's constant, then decide."
    fields:
      - { label: "x = {a}, y = {a*k}" }
      - { label: "x = {c}, y = {c*k}" }
      - { label: "x = {e}, y = {e*j}" }
    fieldsLabel: "constant of proportionality"
    pickLabel: "Proportional?"
    options:
      - { key: "yes", label: "Yes" }
      - { key: "no", label: "No" }
answer: { type: ordered, value: ["{k}", "{k}", "{j}", "no"] }
misconceptions:
  - id: said-yes-past-a-mismatch
    when: "{k}, {k}, {j}, yes"
    says: "Two matching pairs are not enough — the last pair gives {j}, not {k}. Every pair must divide to the same constant."
hints:
  - "Divide each y by its x, all three — the breaker can hide anywhere."
  - "{a*k} ÷ {a} = {k} and {c*k} ÷ {c} = {k}, but {e*j} ÷ {e} = {j} — not proportional."
source: { book: ccss-rp-progression, section: "7.RP.A.2a" }
verify: "{(e*j) * a != (a*k) * e}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-30 }
