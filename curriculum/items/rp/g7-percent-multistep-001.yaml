id: g7.rp.percent-multistep.001
skills: [g7.rp.percent-multistep]
difficulty: 1
representation: worked-equation
params: { n: 4, p: 12 }
generator: { n: { set: [2, 4, 5, 10] }, p: { int: [3, 30] } }
widget: { type: numeric-input, config: { stem: "A ${n*p} game is on sale at {100/n}% off. What is the sale price?" } }
answer: { type: expr, value: "{n*p - p}", form: evaluated, integer: true }
misconceptions:
  - id: answered-the-discount
    when: "{p}"
    says: "${p} is the DISCOUNT — what you save. The question asks what you PAY: {n*p} minus the discount."
hints:
  - "{100/n}% off is 1/{n} off: the discount is {n*p} ÷ {n} = ${p}."
  - "Subtract it: {n*p} − {p} = {n*p - p}."
source: { book: ccss-rp-progression, section: "7.RP.A.3" }
verify: "{(n*p - answer) * n == n*p}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-30 }
