id: g7.rp.percent-multistep.002
skills: [g7.rp.percent-multistep]
difficulty: 2
representation: double-number-line
params: { f: 7, g: 12 }
generator: { f: { int: [2, 9] }, g: { int: [10, 20] } }
widget: { type: numeric-input, config: { stem: "A ${20*g} console is on sale at {5*f}% off. What is the sale price?" } }
answer: { type: expr, value: "{20*g - f*g}", integer: true }
hints:
  - "First find the discount: {5*f}% of ${20*g}. (5% is ${g}.)"
  - "The discount is ${f*g}. Subtract: {20*g} − {f*g} = {20*g - f*g}."
source: { book: ccss-rp-progression, section: "7.RP.A.3" }
verify: "{(20*g - answer) * 100 == 5*f * 20*g}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-27 }
