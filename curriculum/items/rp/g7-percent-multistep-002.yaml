id: g7.rp.percent-multistep.002
skills: [g7.rp.percent-multistep]
difficulty: 2
representation: double-number-line
params: { f: 4, g: 6 }
generator: { f: { int: [2, 9] }, g: { int: [2, 9] } }
widget: { type: numeric-input, config: { stem: "A ${20*g} jacket has {5*f}% sales tax added at the register. What is the total cost?" } }
answer: { type: expr, value: "{20*g + f*g}", integer: true }
hints:
  - "First find the tax: {5*f}% of ${20*g}. (5% is ${g}.)"
  - "The tax is ${f*g}. Add it on: {20*g} + {f*g} = {20*g + f*g}."
source: { book: ccss-rp-progression, section: "7.RP.A.3" }
verify: "{(answer - 20*g) * 100 == 5*f * 20*g}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
