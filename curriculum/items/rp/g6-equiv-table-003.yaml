id: g6.rp.equiv-table.003
skills: [g6.rp.equiv-table]
difficulty: 3
representation: ratio-table
params: { a: 3, b: 10, m: 4 }
generator: { a: { int: [2, 6] }, b: { int: [2, 12], distinct: a }, m: { int: [2, 6] } }
widget:
  type: pair-input
  config:
    stem: "A recipe uses {a} cups of flour to make {b} muffins. Today the baker used {a*m} cups of flour. Write today's ratio — cups and muffins."
    aLabel: "cups"
    bLabel: "muffins"
answer: { type: ordered, value: ["{a*m}", "{b*m}"] }
misconceptions:
  - id: added-instead-of-scaling
    when: "{a+m}, {b+m}"
    says: "Equivalent ratios scale by multiplying BOTH quantities by the same number — here ×{m} — not by adding."
  - id: scaled-one-side
    when: "{a*m}, {b}"
    says: "The cups were scaled but the muffins were left as one batch — BOTH quantities multiply by {m}."
hints:
  - "{a} cups became {a*m} cups — both quantities scale by the same number."
  - "That's × {m}: the muffins become {b} × {m} = {b*m}."
source: { book: ccss-rp-progression, section: "6.RP.A.3a" }
verify: "{answer * a == b * (a*m)}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
