id: g6.rp.equiv-table.003
skills: [g6.rp.equiv-table]
difficulty: 3
representation: null
params: { a: 3, b: 10, m: 4 }
generator: { a: { int: [1, 6] }, b: { int: [2, 12], distinct: a }, m: { int: [2, 6] } }
widget: { type: numeric-input, config: { stem: "A recipe uses {a} cups of flour to make {b} muffins. How many muffins do {a*m} cups make?" } }
answer: { type: expr, value: "{b*m}", integer: true }
misconceptions:
  - id: added-instead-of-scaling
    when: "{b+m}"
    says: "Equivalent ratios scale by multiplying BOTH quantities by the same number — here ×{m} — not by adding."
hints:
  - "{a} cups became {a*m} cups — both quantities scale by the same number."
  - "That's × {m}: the muffins become {b} × {m} = {b*m}."
source: { book: ccss-rp-progression, section: "6.RP.A.3a" }
verify: "{answer * a == b * (a*m)}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
