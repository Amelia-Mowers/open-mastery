id: g6.rp.find-whole.002
skills: [g6.rp.find-whole]
difficulty: 2
representation: ratio-table
params: { n: 4, k: 21 }
generator: { n: { set: [2, 4, 5, 10] }, k: { int: [3, 30] } }
widget: { type: numeric-input, config: { stem: "A water tank is {100/n}% full and holds {k} liters right now. How many liters does the FULL tank hold?" } }
answer: { type: expr, value: "{n*k}", form: evaluated, integer: true }
misconceptions:
  - id: answered-the-part
    when: "{k}"
    says: "{k} liters is what is in the tank NOW — the {100/n}% part. The question asks what the full 100% tank holds."
hints:
  - "{100/n}% full means the tank is 1/{n} full — {k} liters is one of {n} equal parts."
  - "All {n} parts: {k} × {n} = {n*k} liters."
source: { book: ccss-rp-progression, section: "6.RP.A.3c" }
verify: "{(100/n) * answer == k * 100}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-30 }
