id: g6.rp.missing-value.001
skills: [g6.rp.missing-value]
difficulty: 1
representation: double-number-line
params: { a: 3, b: 12, c: 7 }
generator: { a: { int: [2, 4] }, b: { mult_of: a, range: [6, 36] }, c: { int: [5, 12] } }
widget:
  type: double-number-line
  config:
    stem: "{a} pounds of apples cost ${b}. How much do {c} pounds cost?"
    topLabel: "pounds"
    bottomLabel: "dollars"
    top: ["0", "{a}", "{c}"]
    bottom: ["0", "{b}", "?"]
answer: { type: expr, value: "{c*b/a}", integer: true }
hints:
  - "First find the cost of ONE pound: {b} ÷ {a}."
  - "One pound costs ${b/a}. Multiply by {c}: {c} × {b/a} = {c*b/a}."
source: { book: ccss-rp-progression, section: "6.RP.A.3b" }
verify: "{answer * a == b * c}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
