id: g6.rp.compare-rates.003
skills: [g6.rp.compare-rates]
difficulty: 2
representation: number-line
params: { u: 3, d: 2, a1: 5, a2: 8 }
generator: { u: { int: [2, 6] }, d: { int: [1, 4] }, a1: { int: [3, 9] }, a2: { int: [3, 9], distinct: a1 } }
widget: { type: numeric-input, config: { stem: "Pack A: {a1} pencils for ${u*a1}. Pack B: {a2} pencils for ${(u+d)*a2}. In the BETTER buy, how many dollars does one pencil cost?" } }
answer: { type: expr, value: "{u}", form: evaluated, integer: true }
misconceptions:
  - id: answered-the-other-pack
    when: "{u+d}"
    says: "That's the per-pencil price of the OTHER pack. Read the one the question names."
  - id: answered-the-pack-price
    when: "{u*a1}"
    says: "${u*a1} is what the whole pack costs. Per pencil means splitting it into {a1} equal parts."
hints:
  - "Find each pack's price for ONE pencil, then keep the smaller."
  - "A: {u*a1} ÷ {a1} = {u}. B: {(u+d)*a2} ÷ {a2} = {u+d}. The better buy is ${u}."
source: { book: ccss-rp-progression, section: "6.RP.A.3b" }
verify: "{answer * a1 == u*a1}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
