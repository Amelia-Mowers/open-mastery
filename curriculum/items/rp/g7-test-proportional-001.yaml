id: g7.rp.test-proportional.001
skills: [g7.rp.test-proportional]
difficulty: 1
representation: double-number-line
params: { k: 3, a: 2, c: 5, e: 8 }
generator: { k: { int: [2, 9] }, a: { int: [2, 4] }, c: { int: [5, 7] }, e: { int: [8, 12] } }
widget:
  type: compare-input
  config:
    stem: "Is y proportional to x? Find each pair's constant, then decide."
    fields:
      - { label: "x = {a}, y = {a*k}" }
      - { label: "x = {c}, y = {c*k}" }
      - { label: "x = {e}, y = {e*k}" }
    fieldsLabel: "constant of proportionality"
    pickLabel: "Proportional?"
    options:
      - { key: "yes", label: "Yes" }
      - { key: "no", label: "No" }
answer: { type: ordered, value: ["{k}", "{k}", "{k}", "yes"] }
misconceptions:
  - id: said-no-to-one-constant
    when: "{k}, {k}, {k}, no"
    says: "Every pair divides to {k} — one constant multiplying every x is exactly what proportional MEANS."
hints:
  - "Divide each y by its x. Do you get the same number every time?"
  - "{a*k} ÷ {a} = {k}, {c*k} ÷ {c} = {k}, {e*k} ÷ {e} = {k} — one constant everywhere."
source: { book: ccss-rp-progression, section: "7.RP.A.2a" }
verify: "{a*k * c == c*k * a}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-30 }
