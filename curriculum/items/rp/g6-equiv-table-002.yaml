id: g6.rp.equiv-table.002
skills: [g6.rp.equiv-table]
difficulty: 2
representation: worked-equation
params: { a: 3, b: 8, m: 4 }
generator: { a: { int: [1, 6] }, b: { int: [2, 12], distinct: a }, m: { int: [2, 6] } }
widget:
  type: ratio-table
  config:
    stem: "This table shows equivalent ratios. Fill in the missing cups value."
    cols: ["cups", "muffins"]
    rows: [["{a}", "{b}"], ["?", "{b*m}"]]
answer: { type: expr, value: "{a*m}", form: evaluated, integer: true }
misconceptions:
  - id: added-instead-of-scaling
    when: "{a+m}"
    says: "Equivalent ratios scale by multiplying BOTH quantities by the same number — here ×{m} — not by adding."
hints:
  - "The muffins went from {b} to {b*m}. What were they multiplied by?"
  - "Multiply the cups by {m} too: {a} × {m} = {a*m}."
source: { book: ccss-rp-progression, section: "6.RP.A.3a" }
verify: "{answer * b == a * (b*m)}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
