id: g6.rp.missing-value.002
skills: [g6.rp.missing-value]
difficulty: 2
representation: double-number-line
params: { u: 3, v: 4, w: 8 }
generator: { u: { int: [2, 4] }, v: { int: [2, 6], distinct: u }, w: { mult_of: v, range: [8, 24] } }
widget: { type: numeric-input, config: { stem: "A recipe uses {u} cups of rice to serve {v} people. How many cups serve {w} people?" } }
answer: { type: expr, value: "{u*w/v}", form: evaluated, integer: true }
misconceptions:
  - id: added-instead-of-scaling
    when: "{v+w-u}"
    says: "Ratios scale by MULTIPLYING, not by adding the difference. Find the amount for one, then multiply."
hints:
  - "{w} people is {w} ÷ {v} = {w/v} times the recipe."
  - "Scale the cups the same way: {u} × {w/v} = {u*w/v}."
source: { book: ccss-rp-progression, section: "6.RP.A.3b" }
verify: "{answer * v == u * w}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-27 }
