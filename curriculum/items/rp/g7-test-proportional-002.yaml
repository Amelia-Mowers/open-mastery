id: g7.rp.test-proportional.002
skills: [g7.rp.test-proportional]
difficulty: 2
representation: ratio-table
params: { q: 3, r: 2, s: 5, t: 10, u: 2 }
generator: { q: { int: [2, 9] }, r: { int: [2, 4] }, s: { int: [5, 7] }, t: { int: [8, 12] }, u: { int: [1, 5] } }
widget:
  type: ratio-table
  config:
    stem: "Is y proportional to x? Click the row that breaks the pattern — or 'All rows agree'."
    select: true
    noneLabel: "All rows agree"
    cols: ["x", "y"]
    rows: [["{r}", "{r*q}"], ["{s}", "{s*q+u}"], ["{t}", "{t*q}"]]
answer: { type: expr, value: "2", integer: true }
misconceptions:
  - id: said-all-rows-agree
    when: "0"
    says: "One row does break it: {s*q+u} ÷ {s} is not {q}, while the others are. Compare every quotient."
  - id: flagged-a-row-that-fits
    when: "1"
    says: "Row 1 fits: {r*q} ÷ {r} = {q}. Look for the row whose quotient is different."
hints:
  - "Divide y by x in each row. Which quotient is different?"
  - "{r*q} ÷ {r} = {q} and {t*q} ÷ {t} = {q}, but {s*q+u} ÷ {s} is NOT {q} — row 2 breaks it."
source: { book: ccss-rp-progression, section: "7.RP.A.2a" }
verify: "{(s*q+u) * r != r*q * s}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-27 }
