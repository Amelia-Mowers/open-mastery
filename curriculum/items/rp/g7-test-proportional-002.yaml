id: g7.rp.test-proportional.002
skills: [g7.rp.test-proportional]
difficulty: 2
representation: ratio-table
params: { k: 3, a: 2, c: 5, e: 10, d: 2 }
generator: { k: { int: [2, 9] }, a: { int: [2, 4] }, c: { int: [5, 7] }, e: { int: [8, 12] }, d: { int: [1, 5] } }
widget:
  type: ratio-table
  config:
    stem: "Is y proportional to x? Click the row that breaks the pattern — or 'All rows agree'."
    select: true
    noneLabel: "All rows agree"
    cols: ["x", "y"]
    rows: [["{a}", "{a*k}"], ["{c}", "{c*k+d}"], ["{e}", "{e*k}"]]
answer: { type: expr, value: "2", integer: true }
hints:
  - "Divide y by x in each row. Which quotient is different?"
  - "{a*k} ÷ {a} = {k} and {e*k} ÷ {e} = {k}, but {c*k+d} ÷ {c} is NOT {k} — row 2 breaks it."
source: { book: ccss-rp-progression, section: "7.RP.A.2a" }
verify: "{(c*k+d) * a != a*k * c}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
