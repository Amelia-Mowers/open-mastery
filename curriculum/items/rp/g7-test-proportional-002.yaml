id: g7.rp.test-proportional.002
skills: [g7.rp.test-proportional]
difficulty: 2
representation: worked-equation
params: { q: 3, j: 5, r: 2, s: 5, t: 10 }
generator: { q: { int: [2, 9] }, j: { int: [2, 9], distinct: q }, r: { int: [2, 4] }, s: { int: [5, 7] }, t: { int: [8, 12] } }
widget:
  type: compare-input
  config:
    stem: "Is y proportional to x?  x = {r}, y = {r*q}.  x = {s}, y = {s*j}.  x = {t}, y = {t*q}.  Divide each pair, then decide."
    fields:
      - { label: "{r*q} ÷ {r}" }
      - { label: "{s*j} ÷ {s}" }
      - { label: "{t*q} ÷ {t}" }
    pickLabel: "Proportional?"
    options:
      - { key: "yes", label: "Yes" }
      - { key: "no", label: "No" }
answer: { type: ordered, value: ["{q}", "{j}", "{q}", "no"] }
misconceptions:
  - id: said-yes-past-a-mismatch
    when: "{q}, {j}, {q}, yes"
    says: "The quotients are not all the same — {j} is not {q}. One mismatched pair is enough to break proportionality."
hints:
  - "Divide each y by its x. Is any quotient different?"
  - "{r*q} ÷ {r} = {q} and {t*q} ÷ {t} = {q}, but {s*j} ÷ {s} = {j} — not proportional."
source: { book: ccss-rp-progression, section: "7.RP.A.2a" }
verify: "{(s*j) * r != (r*q) * s}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-30 }
