id: g7.rp.constant-k.002
skills: [g7.rp.constant-k]
difficulty: 2
representation: ratio-table
# a < c on EVERY instance: the dnl timeline's x-axis is 0, 1, {a}, {c} and
# tick order must ascend (the old domains allowed a=c and c<a)
params: { k: 5, a: 3, c: 8 }
generator: { k: { int: [2, 9] }, a: { int: [2, 5] }, c: { int: [6, 12] } }
widget: { type: numeric-input, config: { stem: "y is proportional to x. When x = {a}, y = {a*k}. What is the constant of proportionality?" } }
answer: { type: expr, value: "{k}", form: evaluated, integer: true }
misconceptions:
  - id: answered-a-y-value
    when: "{a*k}"
    says: "{a*k} is y when x = {a}. The constant k is y when x is ONE: {a*k} ÷ {a}."
hints:
  - "k is what x is multiplied by to get y."
  - "k = y ÷ x = {a*k} ÷ {a} = {k}."
source: { book: ccss-rp-progression, section: "7.RP.A.2b" }
verify: "{answer * a == a*k}"
review: { status: draft, by: "@claude-fable-5", date: 2026-09-01 }
