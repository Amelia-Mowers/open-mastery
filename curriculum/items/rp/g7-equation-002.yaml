id: g7.rp.equation.002
skills: [g7.rp.equation]
difficulty: 1
representation: worked-equation
params: { k: 6, a: 4, c: 9 }
generator: { k: { int: [2, 9] }, a: { int: [2, 6] }, c: { int: [7, 12] } }
widget:
  type: ratio-table
  config:
    stem: "This table follows y = {k}x. Fill in the missing y."
    cols: ["x", "y"]
    rows: [["1", "{k}"], ["{a}", "{a*k}"], ["{c}", "?"]]
answer: { type: expr, value: "{k*c}", form: evaluated, integer: true }
misconceptions:
  - id: added-k-instead-of-multiplying
    when: "{k+c}"
    says: "y = {k}x means {k} TIMES x. At x = {c} that is {k}·{c}, not {k} + {c}."
  - id: added-instead-of-scaling
    when: "{a*k + c - a}"
    says: "That adds the {c-a} that x went up. Proportional pairs SCALE by multiplying, not by adding — every y is {k} times its x, so use y = {k}x at x = {c}."
hints:
  - "Every y is its x multiplied by {k}."
  - "y = {k} × {c} = {k*c}."
source: { book: ccss-rp-progression, section: "7.RP.A.2c" }
verify: "{answer * a == a*k * c}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
