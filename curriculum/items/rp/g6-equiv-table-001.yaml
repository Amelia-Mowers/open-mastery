id: g6.rp.equiv-table.001
skills: [g6.rp.equiv-table]
difficulty: 1
representation: double-number-line
params: { a: 2, b: 12, m: 3 }
generator: { a: { int: [2, 6] }, b: { int: [2, 12], distinct: a }, m: { int: [2, 6] } }
widget:
  type: pair-input
  config:
    stem: "A recipe uses {a} cups of flour to make {b} muffins. Write the ratio for {m} batches — cups and muffins."
    aLabel: "cups"
    bLabel: "muffins"
answer: { type: ordered, value: ["{a*m}", "{b*m}"] }
misconceptions:
  - id: added-instead-of-scaling
    when: "{a+m}, {b+m}"
    says: "Equivalent ratios scale by multiplying BOTH quantities by the same number — here ×{m} — not by adding."
  - id: scaled-one-side
    when: "{a*m}, {b}"
    says: "The cups were scaled but the muffins were left as one batch — BOTH quantities multiply by {m}."
hints:
  - "{m} batches means BOTH quantities multiply by {m}."
  - "{a} × {m} = {a*m} cups, and {b} × {m} = {b*m} muffins."
source: { book: ccss-rp-progression, section: "6.RP.A.3a" }
verify: "{(a*m) * b == (b*m) * a}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-30 }
