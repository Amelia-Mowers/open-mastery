id: g6.rp.unit-rate.002
skills: [g6.rp.unit-rate]
difficulty: 2
# pages/minutes, NOT pounds/dollars: identifiers are disjoint from the
# a,b family so this item can never feed the pounds-worded timelines
# with printer numbers (identifier discipline). No timeline speaks this
# item's context, so it declares no representation; "show me how" plays
# the worked family as an explicit example.
representation: null
params: { m: 6, p: 90 }
generator: { m: { int: [3, 12] }, p: { mult_of: m, range: [36, 144] } }
widget: { type: numeric-input, config: { stem: "A printer prints {p} pages in {m} minutes. How many pages per minute is that?" } }
answer: { type: expr, value: "{p/m}", form: evaluated, integer: true }
misconceptions:
  - id: answered-the-total
    when: "{p}"
    says: "{p} is the total for all {m} minutes. A unit rate is what ONE minute prints: {p} split into {m} equal parts."
hints:
  - "One minute is an equal share of the {m} minutes."
  - "{p} ÷ {m} = {p/m} pages each minute."
source: { book: ccss-rp-progression, section: "6.RP.A.3b" }
verify: "{answer * m == p}"
review: { status: draft, by: "@claude-fable-5", date: 2026-09-01 }
