id: g6.rp.compare-rates.004
skills: [g6.rp.compare-rates]
difficulty: 3
representation: worked-equation
params: { r: 4, d: 3, t1: 5, t2: 7 }
generator: { r: { int: [2, 6] }, d: { int: [1, 4] }, t1: { int: [3, 8] }, t2: { int: [3, 8], distinct: t1 } }
widget:
  type: compare-input
  config:
    stem: "Printer A prints {r*t1} pages in {t1} minutes. Printer B prints {(r+d)*t2} pages in {t2} minutes. Find each printer's pages per minute, then pick the faster one."
    aLabel: "Printer A — pages per minute"
    bLabel: "Printer B — pages per minute"
    pickLabel: "The faster printer"
    options:
      - { key: a, label: "Printer A" }
      - { key: b, label: "Printer B" }
answer: { type: ordered, value: ["{r}", "{r+d}", "b"] }
misconceptions:
  - id: swapped-the-printers
    when: "{r+d}, {r}, a"
    says: "Those are each other's rates — {r*t1} ÷ {t1} = {r} belongs to Printer A. Recheck which total goes with which printer."
  - id: answered-the-total
    when: "{r*t1}, {(r+d)*t2}, b"
    says: "Those are whole-JOB totals. Pages per minute means splitting each job across its own minutes."
hints:
  - "Split each printer's pages across its own minutes."
  - "A: {r*t1} ÷ {t1} = {r}. B: {(r+d)*t2} ÷ {t2} = {r+d}. The larger per-minute rate wins."
source: { book: ccss-rp-progression, section: "6.RP.A.3b" }
verify: "{((r+d)*t2) * t1 > (r*t1) * t2}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-30 }
