id: prealg.lineq.reciprocal.003
skills: [prealg.lineq.reciprocal]
difficulty: 2
representation: balance-scale
params: { p: 3, q: 4, b: 12, variable: n }
generator:
  q: { int: [2, 9] }
  p: { int: [2, 9], coprime: q, distinct: q }
  b: { mult_of: p, range: [10, 60] }
widget: { type: equation-input, config: { stem: "Solve for {variable}: {p}/{q} {variable} = {b}." } }
answer: { type: expr, value: "{variable} = {q*b/p}", equivalence: symbolic, form: evaluated, integer: true }
viz: { template: balance-scale, bind: { left: "{p}/{q} {variable}", right: "{b}" } }
misconceptions:
  - id: multiplied-by-the-fraction
    when: "{p*b/q}"
    says: "Multiplying by {p}/{q} again makes it smaller. To undo {p}/{q}, multiply by its RECIPROCAL, {q}/{p}."
  - id: forgot-to-divide
    when: "{q*b}"
    says: "Multiplying by {q} clears the fraction — but that leaves {p}{variable} = {q*b}, and {variable} still carries the {p}. Divide both sides by {p} to finish."
hints:
  - "Multiply both sides by {q} first — that clears the fraction: {p}{variable} = {q*b}."
  - "Now divide both sides by {p}. (Shortcut: multiplying by the reciprocal {q}/{p} does both at once.)"
source: { book: openstax-prealgebra-2e, section: "8.2" }
verify: "{p * answer / q == b}"
review: { status: draft, by: "@claude-fable-5", date: 2026-09-10 }
