id: prealg.lineq.simplify-first.002
skills: [prealg.lineq.simplify-first]
difficulty: 2
representation: null
params: { a: 3, b: 2, c: 6, ans: -7, variable: n }
generator:
  a: { int: [2, 6] }
  b: { int: [2, 9] }
  c: { int: [2, 12] }
  ans: { int: [-9, 9] }
widget:
  type: equation-input
  config:
    stem: "Solve: -{a}({variable} - {b}) - {c} = {-a*(ans-b)-c}."
answer: { type: expr, value: "{variable} = {ans}", equivalence: symbolic, integer: true }
misconceptions:
  - id: dropped-the-outer-negative
    when: "{(-a*(ans-b)-c-c)/(-a)+b}"
    says: "The minus in front of the parentheses multiplies EVERYTHING inside by −1 — both the {variable} and the −{b}."
  - id: forgot-the-constant
    when: "{ans+c}"
    says: "The −{c} sits outside the parentheses, so it has to be cleared from both sides too."
hints:
  - "Distribute -{a} first."
  - "-{a}({variable} - {b}) = {-a}{variable} + {a*b}."
source: { book: openstax-prealgebra-2e, section: "8.2" }
verify: "{-a*(answer - b) - c == -a*(ans-b) - c}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
