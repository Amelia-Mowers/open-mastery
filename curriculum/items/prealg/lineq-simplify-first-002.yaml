id: prealg.lineq.simplify-first.002
skills: [prealg.lineq.simplify-first]
difficulty: 2
representation: balance-scale
params: { c1: 14, c2: 9, c3: 6, d1: 8, ans: 3, variable: y }
generator:
  c1: { int: [12, 19] }
  c2: { int: [5, 18], distinct: c3 }
  c3: { int: [2, 9] }
  d1: { int: [2, 9] }
  ans: { int: [2, 6] }
widget:
  type: equation-input
  config:
    stem: "Solve: {c1}{variable} + {c2}{variable} − {c3}{variable} = {d1} + {(c1+c2-c3)*ans - d1}."
answer: { type: expr, value: "{variable} = {ans}", equivalence: symbolic, form: evaluated, integer: true }
misconceptions:
  - id: dropped-a-like-term
    when: "{((c1+c2-c3)*ans)/(c1+c2)}"
    says: "That's only {c1}{variable} and {c2}{variable} combined — the −{c3}{variable} is a like term too. All three merge: {c1} + {c2} − {c3} = {c1+c2-c3}."
  - id: added-the-variable-terms
    when: "{((c1+c2-c3)*ans)/(c1+c2+c3)}"
    says: "The −{c3}{variable} is taken away, so the {variable}-terms give {c1} + {c2} − {c3} = {c1+c2-c3}, not {c1+c2+c3}."
  - id: divided-before-combining
    when: "{((c1+c2-c3)*ans)/c1}"
    says: "There are three {variable}-terms — combine them into {c1+c2-c3}{variable} FIRST, then divide by that."
  - id: forgot-to-divide
    when: "{(c1+c2-c3)*ans}"
    says: "{(c1+c2-c3)*ans} is the tidied right side — but that equals {c1+c2-c3}{variable}, not {variable}. One more step: divide by {c1+c2-c3}."
hints:
  - "Gather the {variable}-terms on the left and the plain numbers on the right."
  - "{c1} + {c2} − {c3} = {c1+c2-c3}, so {c1+c2-c3}{variable} = {(c1+c2-c3)*ans}."
source: { book: openstax-prealgebra-2e, section: "8.2" }
verify: "{c1*answer + c2*answer - c3*answer == d1 + ((c1+c2-c3)*ans - d1)}"
review: { status: draft, by: "@claude-fable-5", date: 2026-09-09 }
