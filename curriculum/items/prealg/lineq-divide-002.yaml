id: prealg.lineq.divide.002
skills: [prealg.lineq.divide]
difficulty: 2
representation: balance-scale
params: { a: 3, b: -48, variable: y }
generator: { a: { int: [2, 12] }, b: { mult_of: a, range: [-60, -12] } }
widget: { type: equation-input, config: { stem: "Solve: {a}{variable} = {b}." } }
answer: { type: expr, value: "{variable} = {b/a}", equivalence: symbolic, integer: true }
viz: { template: balance-scale, bind: { left: "{a}{variable}", right: "{b}" } }
misconceptions:
  - id: subtracted-the-coefficient
    when: "{b-a}"
    says: "{a}{variable} means {a} TIMES {variable}, not {a} plus {variable} — so subtracting {a} won't free it. Undo a multiply with a divide."
hints:
  - "What operation undoes multiplying by {a}?"
  - "Divide both sides by {a}."
source: { book: openstax-prealgebra-2e, section: "8.2", exercise: "m81321:fs-id1166489098384" }
verify: "{a * answer == b}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
