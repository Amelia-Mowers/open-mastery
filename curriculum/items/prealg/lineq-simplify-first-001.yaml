id: prealg.lineq.simplify-first.001
skills: [prealg.lineq.simplify-first]
difficulty: 1
representation: worked-equation
params: { c1: 8, c2: 9, c3: 5, d1: 3, ans: 2, variable: x }
generator:
  c1: { int: [5, 12] }
  c2: { int: [2, 9], distinct: c3 }
  c3: { int: [2, 4] }
  d1: { int: [2, 5] }
  ans: { int: [2, 6] }
widget:
  type: equation-input
  config:
    stem: "Solve: {c1}{variable} + {c2}{variable} − {c3}{variable} = {d1} + {(c1+c2-c3)*ans - d1}."
answer: { type: expr, value: "{variable} = {ans}", equivalence: symbolic, form: evaluated, integer: true }
misconceptions:
  - id: divided-before-combining
    when: "{((c1+c2-c3)*ans)/c1}"
    says: "There are three {variable}-terms — combine them into {c1+c2-c3}{variable} FIRST, then divide by that."
  - id: forgot-to-divide
    when: "{(c1+c2-c3)*ans}"
    says: "{(c1+c2-c3)*ans} is the tidied right side — but that equals {c1+c2-c3}{variable}, not {variable}. One more step: divide by {c1+c2-c3}."
hints:
  - "Combine the like terms on each side first."
  - "The left side becomes {c1+c2-c3}{variable}."
source: { book: openstax-prealgebra-2e, section: "8.2" }
verify: "{c1*answer + c2*answer - c3*answer == d1 + ((c1+c2-c3)*ans - d1)}"
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
