id: g7.ee.combine.exp-table
skill: g7.ee.combine
representation: ratio-table
widget: ratio-table
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{a}{variable} + {b} − {c}{variable} + {d}", " = ", "?"], cols: ["{variable}", "value"], rows: [["1", "{a-c+b+d}"], ["2", "{2*a-2*c+b+d}"], ["3", "{3*a-3*c+b+d}"]], reveal: "0" }, caption: "{a}{variable} + {b} − {c}{variable} + {d} — four terms, one value for each {variable}." }
  - t: 4.5
    patch: { eqHighlight: ["0"], reveal: "1", highlight: "1" }
    caption: "{variable} = 1 gives {a} + {b} − {c} + {d} = {a-c+b+d}."
    expect:
      type: numeric
      value: "{a-c+b+d}"
      prompt: "Feed {variable} = 1: {a}·1 + {b} − {c}·1 + {d} — what comes out?"
      hint: "Work left to right: add, take away, add."
  - t: 9
    patch: { reveal: "2", highlight: "2" }
    caption: "{variable} = 2 gives {2*a-2*c+b+d}. What SHORTER expression makes this same table?"
    expect:
      type: numeric
      value: "{2*a-2*c+b+d}"
      prompt: "Feed {variable} = 2 through all four terms — what comes out?"
      hint: "{a}·2 + {b} − {c}·2 + {d}."
  - { t: 13.5, patch: { equation: ["{a}{variable} + {b} − {c}{variable} + {d}", " = ", "{a-c}{variable} + {b+d}"], eqHighlight: ["2"], reveal: "3", highlight: "3" }, caption: "{a-c}{variable} + {b+d} gives the same value for EVERY {variable} — the four terms combine to two." }
  - { t: 16.5, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-01 }
