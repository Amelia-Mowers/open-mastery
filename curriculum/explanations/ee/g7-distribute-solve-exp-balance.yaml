id: g7.ee.distribute-solve.exp-balance
skill: g7.ee.distribute-solve
representation: balance-scale
widget: balance-scale
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{a}", "({variable} + {b})", " = ", "{a*(ans+b)}"], left: "{a}({variable} + {b})", right: "{a*(ans+b)}", leftIn: false, rightIn: false }, caption: "The parentheses ride the scale as one package." }
  - { t: 4, patch: { eqHighlight: ["0", "1"], leftIn: true, highlight: left }, caption: "Everything left of the = weighs together on one pan: {a} copies of ({variable} + {b}).", expect: { type: pick, value: ["0", "1"], prompt: "Which piece — or pieces — of the equation go on the LEFT pan?" } }
  - { t: 8, patch: { eqHighlight: ["3"], rightIn: true, highlight: right }, caption: "{a*(ans+b)} on the right. The = promises both pans hold the SAME amount — the scale sits level.", expect: { type: pick, value: ["3"], prompt: "Which piece — or pieces — of the equation go on the RIGHT pan?" } }
  - { t: 12, patch: { eqHighlight: ["0"], highlight: left, op: divide, by: "{a}" }, caption: "Undo the OUTER × {a} first: divide both pans by {a}.", expect: { type: op, value: "divide {a}", prompt: "What do you do to BOTH pans first?", hint: "The left pan is {a} copies of one package — dividing both pans by {a} leaves ONE." } }
  - { t: 16, patch: { equation: ["{variable}", " + {b}", " = ", "{ans+b}"], left: "{variable} + {b}", right: "{ans+b}", op: null, eqHighlight: [], highlight: null }, caption: "One copy each side: {variable} + {b} = {ans+b} — now only the + {b} hides {variable}." }
  - t: 20
    patch: { op: subtract, by: "{b}" }
    caption: "Subtract {b} from both pans. So what is {variable}?"
    expect:
      type: op
      value: "subtract {b}"
      misconceptions:
        - id: multiplied-back
          when: "multiply {a}"
          says: "The × {a} is already undone. What is left is + {b} — take it off both pans."
  - { t: 23.5, patch: { equation: ["{variable}", " = ", "{ans}"], left: "{variable}", right: "{ans}", op: null }, caption: "With the {b} gone, {variable} stands alone: {variable} = {ans}." }
  - { t: 26, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-09 }
