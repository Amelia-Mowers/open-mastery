id: g7.ee.distribute-solve.exp-balance
skill: g7.ee.distribute-solve
representation: balance-scale
widget: balance-scale
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{a}", "({variable} + {b})", " = ", "{a*(ans+b)}"], left: "{a}({variable} + {b})", right: "{a*(ans+b)}", leftIn: false, rightIn: false }, caption: "The parentheses ride the scale as one package." }
  - { t: 4, patch: { eqHighlight: ["0", "1"], leftIn: true, highlight: left }, caption: "{a} copies of ({variable} + {b}) on the left pan.", expect: { type: pick, value: ["0", "1"], prompt: "Which piece — or pieces — of the equation go on the LEFT pan?" } }
  - { t: 8, patch: { eqHighlight: ["3"], rightIn: true, highlight: right }, caption: "{a*(ans+b)} on the right — balanced.", expect: { type: pick, value: ["3"], prompt: "Which piece of the equation goes on the RIGHT pan?" } }
  - { t: 12, patch: { eqHighlight: ["0"], highlight: left, op: divide, by: "{a}" }, caption: "Undo the OUTER × {a} first: divide both pans by {a}.", expect: { type: op, value: "divide {a}" } }
  - { t: 16, patch: { left: "{variable} + {b}", right: "{ans+b}", op: null, eqHighlight: [], highlight: null }, caption: "One copy each side: {variable} + {b} = {ans+b} — a problem you already know." }
  - { t: 20, patch: { op: subtract, by: "{b}" }, caption: "Subtract {b} from both pans.", expect: { type: op, value: "subtract {b}" } }
  - { t: 23.5, patch: { left: "{variable}", right: "{ans}", op: null }, caption: "{variable} = {ans}." }
  - { t: 26, handoff: { prompt: "Now you try." } }
