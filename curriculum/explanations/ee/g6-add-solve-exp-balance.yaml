id: g6.ee.add-solve.exp-balance
skill: g6.ee.add-solve
representation: balance-scale
widget: balance-scale
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{variable}", " + {p}", " = ", "{p+d}"], left: "{variable} + {p}", right: "{p+d}", leftIn: false, rightIn: false }, caption: "Here is the problem in symbols. Watch each side land on the scale." }
  - { t: 4, patch: { eqHighlight: ["0", "1"], leftIn: true, highlight: left }, caption: "{variable} + {p} goes on the left pan.", expect: { type: pick, value: ["0", "1"], prompt: "Which piece — or pieces — of the equation go on the LEFT pan?" } }
  - { t: 8, patch: { eqHighlight: ["3"], rightIn: true, highlight: right }, caption: "{p+d} on the right — balanced.", expect: { type: pick, value: ["3"], prompt: "Which piece — or pieces — of the equation go on the RIGHT pan?" } }
  - { t: 12, patch: { eqHighlight: ["1"], highlight: left }, caption: "{variable} is hiding under {p} extra. Undo adding by SUBTRACTING." }
  - { t: 15.5, patch: { op: subtract, by: "{p}", highlight: null, eqHighlight: [] }, caption: "Take {p} off BOTH pans — the scale stays balanced.", expect: { type: op, value: "subtract {p}" } }
  - { t: 19, patch: { left: "{variable}", right: "{d}", op: null }, caption: "{variable} = {d}." }
  - { t: 21, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-08-27 }
