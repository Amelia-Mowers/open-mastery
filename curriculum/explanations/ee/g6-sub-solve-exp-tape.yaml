id: g6.ee.sub-solve.exp-tape
skill: g6.ee.sub-solve
representation: tape-diagram
widget: tape-diagram
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{variable}", " − {p}", " = ", "{d}"], cells: ["{d}", "{p}"], total: "{variable} − {p}", cellsIn: 0, totalIn: false }, caption: "{variable} had {p} taken away. The bar will show what is LEFT." }
  - t: 4
    patch: { eqHighlight: ["3"], cellsIn: 1, totalIn: true, highlight: ["1"] }
    caption: "The bar holds {d} — everything left after the {p} came off. The brace reads {variable} − {p}."
    expect:
      type: pick
      value: ["3"]
      prompt: "Which piece — or pieces — of the equation is the bar you can SEE?"
      hint: "The equation says what remains after the subtraction."
  - t: 8
    patch: { eqHighlight: ["1"], cellsIn: 2, total: "{variable}", highlight: ["2"] }
    caption: "The {p} goes back on and the bar is WHOLE again: {variable}. So how long is {variable}?"
    expect:
      type: op
      value: "add {p}"
      prompt: "To undo the − {p} and see all of {variable}, what do you do?"
      hint: "Put back what was taken."
      misconceptions:
        - id: subtracted-instead-of-added
          when: "subtract {p}"
          says: "Taking {p} away again makes the bar even shorter. The − {p} is undone by putting the {p} back."
  - t: 12
    patch: { eqHighlight: [], highlight: ["1", "2"] }
    caption: "{d} + {p} = {p+d}. The whole bar — {variable} — is {p+d}."
    expect:
      type: numeric
      value: "{p+d}"
      prompt: "Look at the bar: {d} and the returned {p} together — how long is {variable}?"
      hint: "Put the two sections together."
  - { t: 16, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-01 }
