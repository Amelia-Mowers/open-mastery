id: g7.ee.two-step.exp-balance
skill: g7.ee.two-step
representation: balance-scale
widget: balance-scale
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{a}{variable}", " + {b}", " = ", "{a*ans+b}"], left: "{a}{variable} + {b}", right: "{a*ans+b}", leftIn: false, rightIn: false }, caption: "TWO operations hide {variable}: a multiply and an add. Watch." }
  - t: 4
    patch: { eqHighlight: ["0", "1"], leftIn: true, highlight: left }
    caption: "{a}{variable} + {b} sits on the left pan."
    expect:
      type: pick
      value: ["0", "1"]
      prompt: "Which piece — or pieces — of the equation go on the LEFT pan?"
      hint: "The whole {variable} side — every piece of it — sits on the left pan."
  - t: 8
    patch: { eqHighlight: ["3"], rightIn: true, highlight: right }
    caption: "{a*ans+b} on the right — balanced."
    expect:
      type: pick
      value: ["3"]
      prompt: "And which piece — or pieces — balance it on the RIGHT pan?"
      hint: "The lone number after the equals sign."
  - t: 12
    patch: { eqHighlight: ["1"], highlight: left, op: subtract, by: "{b}" }
    caption: "Peel the OUTSIDE first: subtract {b} from both pans."
    expect:
      type: op
      value: "subtract {b}"
      prompt: "Two operations hide {variable}. Which one do you undo FIRST?"
      hint: "The + {b} was applied LAST, so it comes off first. Which move un-does adding {b}?"
      misconceptions:
        - id: divided-before-clearing-the-add
          when: "divide {a}"
          says: "Dividing now would split the + {b} as well. Clear the {b} off both pans FIRST, then divide."
        - id: added-instead-of-subtracted
          when: "add {b}"
          says: "Adding {b} puts MORE on the left. The {b} is already there — take it away from both pans."
  - { t: 16, patch: { left: "{a}{variable}", right: "{a*ans}", op: null, eqHighlight: ["0"], highlight: null }, caption: "Now it reads {a}{variable} = {a*ans} — a problem you already know." }
  - t: 20
    patch: { op: divide, by: "{a}" }
    caption: "Divide both pans by {a}. So what is {variable}?"
    expect:
      type: op
      value: "divide {a}"
      prompt: "One operation left. What frees {variable}?"
      hint: "{a}{variable} means {variable} multiplied by {a} — which move un-does multiplying?"
  - { t: 23.5, patch: { left: "{variable}", right: "{ans}", op: null, eqHighlight: [] }, caption: "{variable} = {ans}." }
  - { t: 26, handoff: { prompt: "Now you try." } }
review: { status: vetted, by: "@Amelia-Mowers", date: 2026-08-29 }
