id: g6.ee.sub-solve.exp-balance
skill: g6.ee.sub-solve
representation: balance-scale
widget: balance-scale
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{variable}", " − {p}", " = ", "{d}"], left: "{variable} − {p}", right: "{d}", leftIn: false, rightIn: false }, caption: "The problem in symbols — each side takes its place on the scale." }
  - { t: 4, patch: { eqHighlight: ["0", "1"], leftIn: true, highlight: left }, caption: "{variable} − {p} goes on the left pan.", expect: { type: pick, value: ["0", "1"], prompt: "Which piece — or pieces — of the equation go on the LEFT pan?" } }
  - { t: 8, patch: { eqHighlight: ["3"], rightIn: true, highlight: right }, caption: "{d} on the right — balanced.", expect: { type: pick, value: ["3"], prompt: "Which piece — or pieces — of the equation go on the RIGHT pan?" } }
  - { t: 12, patch: { eqHighlight: ["1"], highlight: left }, caption: "{variable} had {p} TAKEN AWAY." }
  - t: 15.5
    patch: { op: add, by: "{p}", highlight: null, eqHighlight: [] }
    caption: "Add {p} to BOTH pans — the scale stays balanced. So what is {variable}?"
    expect:
      type: op
      value: "add {p}"
      misconceptions:
        - id: subtracted-instead-of-added
          when: "subtract {p}"
          says: "The {p} was already taken away — taking away more leaves even less. Put it back: add {p} to both pans."
  - { t: 19, patch: { left: "{variable}", right: "{p+d}", op: null }, caption: "{variable} = {p+d}." }
  - { t: 21, handoff: { prompt: "Now you try." } }
review: { status: vetted, by: "@Amelia-Mowers", date: 2026-08-29 }
