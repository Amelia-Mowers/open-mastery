id: g6.ee.add-solve.exp-tape
skill: g6.ee.add-solve
representation: tape-diagram
widget: tape-diagram
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{variable}", " + {p}", " = ", "{p+d}"], cells: ["{variable}", "{p}"], total: "{p+d}", cellsIn: 0, totalIn: false }, caption: "An empty bar. Watch the equation build it, piece by piece." }
  - t: 4
    patch: { eqHighlight: ["0"], cellsIn: 1, highlight: ["1"] }
    caption: "{variable} is the first piece of the bar — the part we are looking for."
    expect:
      type: pick
      value: ["0"]
      prompt: "Which piece — or pieces — of the equation goes in the FIRST section of the bar?"
      hint: "The bar is {variable} and {p} laid end to end. Which one is the unknown part?"
  - t: 8
    patch: { eqHighlight: ["1"], cellsIn: 2, highlight: ["2"] }
    caption: "{p} joins it — the two pieces sit end to end."
    expect:
      type: pick
      value: ["1"]
      prompt: "Which piece — or pieces — goes in the SECOND section, right next to it?"
      hint: "The + {p} is added ON to {variable}, so it sits alongside it in the bar."
  - t: 12
    patch: { eqHighlight: ["3"], totalIn: true, highlight: [] }
    caption: "Both pieces together measure {p+d} — that is the whole bar."
    expect:
      type: pick
      value: ["3"]
      prompt: "Which piece — or pieces — of the equation measures the WHOLE bar?"
      hint: "The = tells you what everything adds up to."
  - t: 16
    patch: { eqHighlight: [], highlight: ["1"], removed: ["2"], totalOp: { op: subtract, by: "{p}" } }
    caption: "Take the {p} section off — and take {p} off the total too. So how long is the {variable} piece?"
    expect:
      type: op
      value: "subtract {p}"
      prompt: "To uncover the first piece, what do you do to {p+d}?"
      hint: "Cover the {p} section with your finger. What is left of the {p+d}?"
      misconceptions:
        - id: added-instead-of-subtracted
          when: "add {p}"
          says: "Adding {p} makes the bar longer. The {p} piece is already inside the {p+d} — take it off to see what's left."
  - t: 20
    patch: { eqHighlight: [], highlight: ["1", "2"] }
    caption: "{p+d} − {p} = {d}. The first piece — {variable} — is {d}."
    expect:
      type: numeric
      value: "{d}"
      prompt: "Look at the bar: {p+d} across, and {p} of it is the second piece. How long is the first piece?"
      hint: "Cover the {p} section. What is left of the {p+d}?"
  - { t: 24, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-08-27 }
