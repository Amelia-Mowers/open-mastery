id: g6.ee.add-solve.exp-worked
skill: g6.ee.add-solve
representation: worked-equation
widget: worked-equation
params_from: item
timeline:
  - { t: 0, patch: { start: "{variable} + {p} = {p+d}" }, caption: "On the board: {variable} has {p} added to it. What undoes that?" }
  - { t: 4, patch: { line: "{variable} + {p} − {p} = {p+d} − {p}", note: "the same move on both sides" }, caption: "− {p} on both sides — that is what undoes the + {p}.", expect: { type: op, value: "subtract {p}", prompt: "What do you do to BOTH sides to peel the {p} off {variable}?", hint: "{p} is ADDED to {variable}. The opposite of adding {p} is subtracting {p} — and it goes on both sides." } }
  - { t: 8.5, patch: { line: "{variable} = {d}", note: "{p} − {p} = 0" }, caption: "{variable} = {d}.", expect: { type: expr, value: "{variable} = {d}", prompt: "{p} − {p} is 0, so what line is left?" } }
  - { t: 11, handoff: { prompt: "Now you try." } }
