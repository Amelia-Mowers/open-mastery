  - { t: 8.5, patch: { line: "{variable} = {d}", note: "{p} − {p} = 0" }, caption: "{variable} = {d}.", expect: { type: expr, value: "{variable} = {d}", prompt: "The {p}s cancel — simplify. What is {variable}?" } }
  - { t: 11, handoff: { prompt: "Now you try." } }
