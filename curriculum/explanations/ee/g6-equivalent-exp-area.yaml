id: g6.ee.equivalent.exp-area
skill: g6.ee.equivalent
representation: area-model
widget: area-model
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{m}", "({variable} + {n})"], height: "{m}", parts: ["{variable}", "{n}"], fillRows: "0" }, caption: "{m}({variable} + {n}) is a rectangle waiting to be filled. How tall, how wide?" }
  - t: 4
    patch: { eqHighlight: ["0"], fillRows: "{m}" }
    caption: "The number out front is the HEIGHT — {m} rows fill in."
    expect:
      type: numeric
      value: "{m}"
      prompt: "{m}({variable} + {n}) — how tall should the rectangle be?"
      hint: "The number of copies is the number of rows."
  - t: 8
    patch: { eqHighlight: ["1"], highlight: ["1", "2"] }
    caption: "The width splits into {variable} and {n}. So what does {m}({variable} + {n}) expand to?"
    expect:
      type: pick
      value: ["1"]
      prompt: "Which piece — or pieces — of the expression make the WIDTH of the rectangle?"
      hint: "Everything inside the parentheses sits along the top."
  - { t: 12, patch: { eqHighlight: [], products: ["{m}{variable}", "{m*n}"], highlight: [] }, caption: "Two pieces of area: {m}({variable} + {n}) = {m}{variable} + {m*n}." }
  - { t: 15, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-01 }
