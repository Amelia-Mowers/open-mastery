id: g6.ee.equivalent.exp-table
skill: g6.ee.equivalent
representation: ratio-table
widget: ratio-table
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{m}({variable} + {n})", " = ", "?"], cols: ["{variable}", "{m}({variable} + {n})"], rows: [["1", "{m*(1+n)}"], ["2", "{m*(2+n)}"], ["3", "{m*(3+n)}"]], reveal: "0" }, caption: "Equivalent means: same output for EVERY input — the table puts {m}({variable} + {n}) to the test." }
  - t: 4
    patch: { eqHighlight: ["0"], reveal: "1", highlight: "1" }
    caption: "{variable} = 1: {m}(1 + {n}) = {m*(1+n)}."
    expect:
      type: numeric
      value: "{m*(1+n)}"
      prompt: "{variable} = 1: {m}(1 + {n}) — what comes out?"
      hint: "Add inside the parentheses first, then multiply by {m}."
  - t: 8.5
    patch: { reveal: "2", highlight: "2" }
    caption: "{variable} = 2: {m}(2 + {n}) = {m*(2+n)}."
    expect:
      type: numeric
      value: "{m*(2+n)}"
      prompt: "{variable} = 2: what does {m}({variable} + {n}) give?"
      hint: "Same moves: parentheses first, then × {m}."
  - t: 13
    patch: { reveal: "3", highlight: "3" }
    caption: "Every input agrees. What expanded expression — no parentheses — makes this SAME table?"
    expect:
      type: numeric
      value: "{m*(3+n)}"
      prompt: "{variable} = 3: {m}(3 + {n}) — what does it give?"
      hint: "3 + {n}, taken {m} times."
  - { t: 17, patch: { equation: ["{m}({variable} + {n})", " = ", "{m}{variable} + {m*n}"], eqHighlight: ["2"] }, caption: "{m}{variable} + {m*n} matches for every {variable}: {m}({variable} + {n}) = {m}{variable} + {m*n}." }
  - { t: 20, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-02 }
