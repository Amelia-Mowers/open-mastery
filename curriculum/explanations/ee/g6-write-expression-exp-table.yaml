id: g6.ee.write-expression.exp-table
skill: g6.ee.write-expression
representation: ratio-table
widget: ratio-table
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{p} more than ", "{a} × {variable}"], cols: ["{variable}", "{a}{variable} + {p}"], rows: [["2", "{2*a+p}"], ["5", "{5*a+p}"]], reveal: "0" }, caption: "One phrase, every number. Watch the expression compute." }
  - { t: 4.5, patch: { eqHighlight: ["1"], reveal: "1", highlight: "1" }, caption: "If the number is 2: {a}·2 + {p} = {2*a+p}." }
  - { t: 9, patch: { eqHighlight: ["0"], reveal: "2", highlight: "2" }, caption: "If it's 5: {a}·5 + {p} = {5*a+p}. The expression {a}{variable} + {p} says it for EVERY number." }
  - { t: 12, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-08-27 }
