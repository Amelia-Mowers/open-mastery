id: g7.ee.two-step.exp-worked
skill: g7.ee.two-step
representation: worked-equation
widget: worked-equation
params_from: item
timeline:
  - { t: 0, patch: { start: "{a}{variable} + {b} = {a*ans+b}" }, caption: "TWO things are done to {variable} here: multiplied by {a}, then {b} added. Which one do you undo first?" }
  - t: 4
    patch: { line: "{a}{variable} + {b} − {b} = {a*ans+b} − {b}", note: "the same move on both sides" }
    caption: "The add came LAST, so it comes off FIRST — undo in reverse order."
    expect:
      type: op
      value: "subtract {b}"
      prompt: "What do you do to BOTH sides first?"
      hint: "Undo in reverse order: the {b} was added last, so peel it off first — subtract {b} from both sides."
      misconceptions:
        - id: "divided-before-clearing"
          when: "divide {a}"
          says: "Dividing first splits the {b} too. Take the {b} off both sides FIRST, then divide — undo in reverse order."
  - { t: 8, patch: { line: "{a}{variable} = {a*ans}", note: "the {b}s cancel" }, caption: "The {b}s cancel on the left. One move left: {variable} is still multiplied by {a}.", expect: { type: numeric, value: "{a*ans}", prompt: "The {b}s cancel on the left. What does the RIGHT side come to?", hint: "{a*ans+b} − {b}." } }
  - t: 11
    patch: { line: "{a}{variable} ÷ {a} = {a*ans} ÷ {a}", note: "the same move on both sides" }
    caption: "Now undo the multiply — the same move on both sides."
    expect:
      type: op
      value: "divide {a}"
      prompt: "What do you do to BOTH sides now?"
      hint: "{variable} is multiplied by {a}. Dividing both sides by {a} undoes that."
  - { t: 15, patch: { line: "{variable} = {ans}", note: "the {a}s cancel" }, caption: "{variable} = {ans}." }
  - { t: 17.5, handoff: { prompt: "Now you try." } }
review: { status: vetted, by: "@Amelia-Mowers", date: 2026-08-30 }
