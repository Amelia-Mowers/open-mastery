id: g7.ee.two-step.exp-worked
skill: g7.ee.two-step
representation: worked-equation
widget: worked-equation
params_from: item
timeline:
  - { t: 0, patch: { start: "{a}{variable} + {b} = {a*ans+b}" }, caption: "Undo in REVERSE order: the add came last, so it goes first." }
  - t: 4
    patch: { line: "{a}{variable} = {a*ans+b} − {b} = {a*ans}", note: "the same move on both sides" }
    caption: "Step 1: clear the {b}."
    expect:
      type: expr
      value: "{a}{variable} = {a*ans}"
      prompt: "The {b} is added on. What move clears it, and what line is left?"
      hint: "The + {b} cancels on the left; the right becomes {a*ans+b} − {b}."
  - t: 8.5
    patch: { line: "{variable} = {a*ans} ÷ {a} = {ans}", note: "the same move on both sides" }
    caption: "Step 2: divide by {a}. {variable} = {ans}."
    expect:
      type: expr
      value: "{variable} = {ans}"
      prompt: "{variable} is still multiplied by {a}. What is the last line?"
      hint: "{a*ans} ÷ {a} — how many is that?"
  - { t: 11, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-08-27 }
