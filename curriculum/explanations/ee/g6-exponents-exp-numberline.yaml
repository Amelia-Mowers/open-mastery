  - { t: 4, patch: { eqHighlight: ["0"], marker: "{c}", highlight: ["{c}"] }, caption: "The base {c} is the jump size: one jump lands on {c}." }
  - { t: 8, patch: { eqHighlight: ["1"], marker: "{c*c}", highlight: [] }, caption: "The small 2 says take {c} jumps: they land on {c*c}. {c}² = {c*c}." }
  - { t: 10.5, handoff: { prompt: "Now you try." } }
