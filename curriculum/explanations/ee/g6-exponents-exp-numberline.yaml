id: g6.ee.exponents.exp-numberline
skill: g6.ee.exponents
representation: number-line
widget: number-line
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{c}²", " = ", "?"], min: 0, max: "{c*c}", step: "{c}", labelled: [] }, caption: "{c}² means two equal factors: {c} × {c}. Draw it — equal jumps from 0." }
  - t: 4
    patch: { eqHighlight: ["0"], jumps: { size: "{c}", count: "{c}", shown: 1, label: "+{c}" }, labelled: ["{c}"] }
    caption: "One jump of {c}, drawn to {c}. The second factor counts the jumps."
    expect:
      type: numeric
      value: "{c}"
      prompt: "{c}² — the first factor: how far does ONE jump go?"
      hint: "The base {c} is the jump size."
  - t: 8
    patch: { eqHighlight: [], jumps: { size: "{c}", count: "{c}", label: "+{c}" } }
    caption: "{c} jumps of {c}. Where does the last one land? That is {c}²."
    expect:
      type: numeric
      value: "{c}"
      prompt: "The second factor — how many jumps of {c} in all?"
      hint: "Two equal factors: the base is the size AND the count."
  - { t: 12, patch: { equation: ["{c}²", " = ", "{c*c}"], eqHighlight: ["2"], marker: "{c*c}", labelled: ["{c}", "{c*c}"] }, caption: "{c} jumps of {c} land on {c*c}. {c}² = {c*c}." }
  - { t: 15, handoff: { prompt: "Now you try." } }
review: { status: vetted, by: "@Amelia-Mowers", date: 2026-09-02 }
