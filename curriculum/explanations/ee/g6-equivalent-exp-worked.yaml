id: g6.ee.equivalent.exp-worked
skill: g6.ee.equivalent
representation: worked-equation
widget: worked-equation
params_from: item
timeline:
  - { t: 0, patch: { start: "{a}({b}{variable} + {c})" }, caption: "{a} copies of the WHOLE parenthesis — both parts of it." }
  - { t: 4, patch: { line: "= {a}·{b}{variable} + {a}·{c}", note: "distribute {a} to EACH part" }, caption: "{a} multiplies every part inside — including the {c}. So what is the full expression?", expect: { type: expr, value: "{a*b}{variable}", prompt: "{a} multiplies EVERY part inside. What does the {variable}-part become?", hint: "{a} times {b}{variable} — write it as one term." } }
  - { t: 8.5, patch: { line: "= {a*b}{variable} + {a*c}", note: "equivalent for every {variable}" }, caption: "{a*b}{variable} + {a*c} — same value as {a}({b}{variable} + {c}) for every {variable}.", expect: { type: expr, value: "{a*b}{variable} + {a*c}", form: expanded, prompt: "And the plain-number part — what does the whole expression come to?", hint: "{a}·{c} is {a*c}, so {a*b}{variable} + {a*c}.", misconceptions: [{ id: "distributed-to-first-term-only", when: "{a*b}{variable} + {c}", says: "The {a} multiplies EVERY part inside: {a}·{b}{variable} AND {a}·{c}. The {c} was left untouched." }] } }
  - { t: 11, handoff: { prompt: "Now you try." } }
