id: g6.ee.cube.exp-area
skill: g6.ee.cube
representation: area-model
widget: area-model
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{n}³", " = ", "?"], height: "{n}", parts: ["{n}"], fillRows: "0" }, caption: "{n}³ means three equal factors: {n} × {n} × {n}. The square holds the first two — an empty {n} × {n} grid." }
  - t: 4
    patch: { eqHighlight: ["0"], fillRows: "{n}" }
    caption: "{n} × {n} = {n*n} — ONE layer of the cube. The LAST factor is still waiting."
    expect:
      type: numeric
      value: "{n*n}"
      prompt: "{n} × {n} — how many small squares fill the grid?"
      hint: "{n} rows of {n}."
  - t: 8
    patch: { products: ["{n*n} per layer"] }
    caption: "{n} layers of {n*n} small squares. So what does {n}³ equal?"
    expect:
      type: numeric
      value: "{n}"
      prompt: "{n}³ — the square spent two of its factors. How many layers does the LAST factor stack?"
      hint: "The three factors are {n} × {n} × {n}. The square used two — the factor left over counts the layers."
  - { t: 12, patch: { equation: ["{n}³", " = ", "{n*n*n}"], eqHighlight: ["2"], products: ["{n*n*n} in all"] }, caption: "{n*n} × {n} = {n*n*n}. {n}³ = {n*n*n}." }
  - { t: 15, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-01 }
