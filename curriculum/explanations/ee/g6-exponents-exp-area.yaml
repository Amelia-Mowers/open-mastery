id: g6.ee.exponents.exp-area
skill: g6.ee.exponents
representation: area-model
widget: area-model
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{c}²", " = ", "?"], height: "{c}", parts: ["{c}"], fillRows: "0" }, caption: "{c}² means two equal factors: {c} × {c}. A square — and it fills row by row." }
  - t: 4
    patch: { eqHighlight: ["0"], fillRows: "1" }
    caption: "One row: {c} little squares."
    expect:
      type: numeric
      value: "{c}"
      prompt: "{c}² — the first factor: how many little squares make ONE row?"
      hint: "The base is the width of the square."
  - { t: 8, patch: { fillRows: "2" }, caption: "A second row joins it." }
  - t: 12
    patch: { fillRows: "{c}" }
    caption: "{c} + {c} = {2*c} — but the square keeps going: {c} rows in all. So what is {c}²?"
    expect:
      type: numeric
      value: "{2*c}"
      prompt: "Two rows of {c} — how many little squares so far?"
      hint: "One row and one more row."
  - { t: 16, patch: { equation: ["{c}²", " = ", "{c*c}"], eqHighlight: ["2"], products: ["{c*c}"] }, caption: "{c} rows of {c}: {c}² = {c} × {c} = {c*c}." }
  - { t: 19, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-01 }
