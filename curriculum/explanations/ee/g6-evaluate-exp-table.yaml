# No derive/comparison column here (unlike equivalent/combine/
# write-expression tables): nothing is REWRITTEN in this skill — the
# table's outputs ARE the computation being taught.
id: g6.ee.evaluate.exp-table
skill: g6.ee.evaluate
representation: input-output-table
widget: ratio-table
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{a}{variable} + {b}", " at ", "{variable} = {c}", " → ", "?"], cols: ["{variable}", "{a}{variable} + {b}"], rows: [["1", "{a+b}"], ["2", "{2*a+b}"], ["{c}", "{a*c+b}"]], reveal: "0" }, caption: "Each row feeds {a}{variable} + {b} one number and records what comes out." }
  - t: 4.5
    patch: { eqHighlight: ["0"], reveal: "1", highlight: "1" }
    caption: "Feed it 1: {a}·1 + {b} = {a+b}."
    expect:
      type: numeric
      value: "{a+b}"
      prompt: "Feed it 1: {a}·1 + {b} — what comes out?"
      hint: "Multiply first, then add {b}."
  - t: 9
    patch: { reveal: "2", highlight: "2" }
    caption: "Feed it 2: {a}·2 + {b} = {2*a+b}. Now feed it {c} — what does the expression make?"
    expect:
      type: numeric
      value: "{2*a+b}"
      prompt: "Feed it 2 — what number comes out?"
      hint: "{a}·2, then + {b}."
  - { t: 13.5, patch: { equation: ["{a}{variable} + {b}", " at ", "{variable} = {c}", " → ", "{a*c+b}"], eqHighlight: ["4"], reveal: "3", highlight: "3" }, caption: "Feed it {c}: {a}·{c} + {b} = {a*c+b}." }
  - { t: 16.5, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-09 }
