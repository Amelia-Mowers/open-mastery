id: g6.ee.exponents.exp-worked
skill: g6.ee.exponents
representation: worked-equation
widget: worked-equation
params_from: item
timeline:
  - { t: 0, patch: { start: "{c}²" }, caption: "The small 2 is a COUNT — not a multiplier. It says how many {c}s to multiply together." }
  - { t: 4, patch: { line: "{c}² = {c} × {c}", note: "written out" }, caption: "Two factors of {c}, written out. So what does {c}² equal?", expect: { type: numeric, value: "2", prompt: "How many factors of {c} does {c}² mean?", hint: "The small 2 counts how many times {c} is used as a factor.", misconceptions: [{ id: "exponent-as-multiplier", when: "{2*c}", says: "That is {c} × 2. The small 2 does not multiply — it COUNTS how many {c}s are multiplied together." }] } }
  - { t: 8, patch: { line: "= {c*c}", note: "multiply" }, caption: "{c}² = {c*c}.", expect: { type: numeric, value: "{c*c}", prompt: "{c} times {c} — what does {c}² equal?" } }
  - { t: 10.5, handoff: { prompt: "Now you try." } }
review: { status: vetted, by: "@Amelia-Mowers", date: 2026-08-30 }
