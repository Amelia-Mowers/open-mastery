id: prealg.lineq.simplify-first.exp-worked
skill: prealg.lineq.simplify-first
representation: worked-equation
widget: worked-equation
params_from: item
timeline:
  - { t: 0, patch: { start: "{c1}{variable} + {c2}{variable} − {c3}{variable} = {d1} + {(c1+c2-c3)*ans - d1}" }, caption: "Three {variable}-terms and two plain numbers, all on one line — tidy each side first." }
  - { t: 4, patch: { line: "{c1+c2-c3}{variable} = {d1} + {(c1+c2-c3)*ans - d1}", note: "combine the {variable}s", mark: ["{c1+c2-c3}{variable}", "{d1} + {(c1+c2-c3)*ans - d1}"] }, caption: "{c1} + {c2} − {c3} = {c1+c2-c3}: three {variable}-terms collapse into ONE. The plain numbers are next.", expect: { type: numeric, value: "{c1+c2-c3}", prompt: "{c1} + {c2} − {c3} of the {variable}s — how many {variable}s is that in all?", hint: "{c1} + {c2} − {c3}." } }
  - { t: 9, patch: { line: "{c1+c2-c3}{variable} = {(c1+c2-c3)*ans}", note: "combine the numbers", mark: null }, caption: "Tidy: {c1+c2-c3}{variable} = {(c1+c2-c3)*ans} — a one-step equation.", expect: { type: numeric, value: "{(c1+c2-c3)*ans}", prompt: "{d1} + {(c1+c2-c3)*ans - d1} — what does the right side come to?", hint: "Add them — mind the sign." } }
  - { t: 13, patch: { line: "{c1+c2-c3}{variable} ÷ {c1+c2-c3} = {(c1+c2-c3)*ans} ÷ {c1+c2-c3}", note: "the same move on both sides" }, caption: "÷ {c1+c2-c3} on both sides — that is what undoes the × {c1+c2-c3}. The {c1+c2-c3}s cancel: what is {variable}?", expect: { type: op, value: "divide {c1+c2-c3}", prompt: "What do you do to BOTH sides to leave one {variable}?", hint: "{c1+c2-c3}{variable} means {variable} multiplied by {c1+c2-c3} — undo it with a divide.", misconceptions: [{ id: subtracted-the-coefficient, when: "subtract {c1+c2-c3}", says: "{c1+c2-c3}{variable} means {c1+c2-c3} TIMES {variable}, not {c1+c2-c3} plus {variable} — subtracting will not free it. Undo a multiply with a divide." }] } }
  - { t: 17, patch: { line: "{variable} = {ans}", note: "the {c1+c2-c3}s cancel" }, caption: "{variable} = {ans}.", expect: { type: expr, value: "{variable} = {ans}", form: evaluated, prompt: "The {c1+c2-c3}s cancel — simplify. What is {variable}?" } }
  - { t: 19.5, handoff: { prompt: "Now you try." } }
