id: prealg.lineq.negate.exp-flip
skill: prealg.lineq.negate
representation: opposite-flip
widget: opposite-flip
params_from: item
timeline:
  - { t: 0, patch: { equation: ["-", "{variable}", " = ", "{b}"], eqHighlight: ["3"], value: "{b}" }, caption: "-{variable} = {b} says: the OPPOSITE of {variable} sits at {b}." }
  - t: 4
    patch: { eqHighlight: ["0"], flip: true, landingLabel: false }
    caption: "That minus sign means mirror twin — same distance from 0, other side. So where does {variable} land?"
    expect:
      type: pick
      value: ["0"]
      prompt: "Which piece — or pieces — of the equation says \"the opposite of\"?"
      hint: "The mark that flips {variable} across zero."
  - { t: 8, patch: { eqHighlight: ["1"], resolve: true, landingLabel: true }, caption: "Same distance from 0, other side: {variable} = {-b}." }
  - { t: 10.5, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-01 }
