id: prealg.lineq.multiply.exp-worked
skill: prealg.lineq.multiply
representation: worked-equation
widget: worked-equation
params_from: item
timeline:
  - { t: 0, patch: { start: "{variable}/{a} = {b}" }, caption: "On the board: {variable} is divided by {a}." }
  - { t: 3.5, patch: { line: "{variable}/{a} × {a} = {b} × {a}", note: "multiply both sides by {a}" }, caption: "{variable} is divided by {a}. What undoes that — on both sides?", expect: { type: expr, value: "{variable}/{a} * {a} = {b} * {a}" } }
  - { t: 8, patch: { line: "{variable} = {a*b}", note: "{a} ÷ {a} = 1" }, caption: "{variable} = {a*b}.", expect: { type: expr, value: "{variable} = {a*b}" } }
  - { t: 10.5, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
