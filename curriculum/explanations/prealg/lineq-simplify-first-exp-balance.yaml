id: prealg.lineq.simplify-first.exp-balance
skill: prealg.lineq.simplify-first
representation: balance-scale
widget: balance-scale
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{c1}{variable}", " + {c2}{variable}", " − {c3}{variable}", " = ", "{d1}", " + {(c1+c2-c3)*ans - d1}"], left: "{c1+c2-c3}{variable}", right: "{(c1+c2-c3)*ans}", leftIn: false, rightIn: false }, caption: "Both sides need simplifying before we can solve." }
  - { t: 4, patch: { eqHighlight: ["0", "1", "2"], leftItems: ["{c1}{variable}", "+ {c2}{variable}", "− {c3}{variable}"], highlight: left }, caption: "All three have the same letter part, so they belong on one pan — two weights, and one takeaway.", expect: { type: pick, value: ["0", "1", "2"], prompt: "Which piece — or pieces — of the equation go on the LEFT pan?" } }
  - { t: 9, patch: { leftItems: null, leftIn: true }, caption: "{c1} + {c2} − {c3} = {c1+c2-c3}: the separate weights combine into one lump, {c1+c2-c3}{variable}.", expect: { type: numeric, value: "{c1+c2-c3}", prompt: "Combine the {variable}-terms — how many {variable}s in all?", hint: "{c1} + {c2} − {c3}." } }
  - { t: 14, patch: { eqHighlight: ["4", "5"], leftItems: null, rightItems: ["{d1}", "+ {(c1+c2-c3)*ans - d1}"], highlight: right }, caption: "The plain numbers are like terms too — they land together on the right pan.", expect: { type: pick, value: ["4", "5"], prompt: "Which piece — or pieces — of the equation go on the RIGHT pan?" } }
  - { t: 19, patch: { rightItems: null, rightIn: true }, caption: "{d1} + {(c1+c2-c3)*ans - d1} = {(c1+c2-c3)*ans}: one plain number on the right pan — and the scale levels out.", expect: { type: numeric, value: "{(c1+c2-c3)*ans}", prompt: "Combine the plain numbers — what do they come to?", hint: "{d1} + {(c1+c2-c3)*ans - d1}." } }
  - { t: 24, patch: { equation: ["{c1+c2-c3}{variable}", " = ", "{(c1+c2-c3)*ans}"], eqHighlight: [], highlight: null }, caption: "Both sides tidy: {c1+c2-c3}{variable} = {(c1+c2-c3)*ans} — a one-step equation." }
  - t: 28
    patch: { op: divide, by: "{c1+c2-c3}" }
    caption: "Divide BOTH pans by {c1+c2-c3}: both sides shrink the same way, still level. So what is {variable}?"
    expect:
      type: op
      value: "divide {c1+c2-c3}"
      prompt: "What do you do to BOTH pans to leave a single {variable}?"
      misconceptions:
        - id: divided-by-one-coefficient
          when: "divide {c1}"
          says: "Divide by the COMBINED coefficient — {c1} + {c2} − {c3} = {c1+c2-c3}, not by {c1} alone."
  - { t: 31, patch: { equation: ["{variable}", " = ", "{ans}"], left: "{variable}", right: "{ans}", op: null }, caption: "One {variable} alone balances {ans}: {variable} = {ans}." }
  - { t: 33, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-09 }
