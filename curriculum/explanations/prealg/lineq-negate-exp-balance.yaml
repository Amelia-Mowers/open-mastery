id: prealg.lineq.negate.exp-balance
skill: prealg.lineq.negate
representation: balance-scale
widget: balance-scale
params_from: item
timeline:
  - { t: 0, patch: { equation: ["−{variable}", " = ", "{b}"], left: "−{variable}", right: "{b}", leftIn: false, rightIn: false }, caption: "The OPPOSITE of {variable} sits on the scale." }
  - { t: 4, patch: { eqHighlight: ["0"], leftIn: true, highlight: left }, caption: "−{variable} — the OPPOSITE of {variable} — sits on the left pan.", expect: { type: pick, value: ["0"], prompt: "Which piece — or pieces — of the equation go on the LEFT pan?" } }
  - { t: 8, patch: { eqHighlight: ["2"], rightIn: true, highlight: right }, caption: "= {b} says they weigh the same: the opposite of {variable} is exactly {b}.", expect: { type: pick, value: ["2"], prompt: "Which piece — or pieces — of the equation go on the RIGHT pan?" } }
  - t: 12
    patch: { eqHighlight: ["0"], highlight: left, op: multiply, by: "−1" }
    caption: "Multiply both pans by −1: every weight flips to its opposite, and sides flipped TOGETHER still balance. So what is {variable}?"
    expect:
      type: op
      value: "multiply -1"
      prompt: "What ONE move on BOTH pans turns −{variable} into {variable}?"
      misconceptions:
        - id: divided-by-the-value
          when: "divide {b}"
          says: "Dividing by {b} does not touch the minus sign. Flipping the sign is a multiply by −1."
  - { t: 16, patch: { left: "{variable}", right: "{-b}", op: null, eqHighlight: [], highlight: null }, caption: "−{variable} was {b}, so {variable} is its opposite: {variable} = {-b}." }
  - { t: 18.5, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-09 }
