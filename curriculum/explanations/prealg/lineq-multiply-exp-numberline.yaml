id: prealg.lineq.multiply.exp-numberline
skill: prealg.lineq.multiply
representation: number-line
widget: number-line
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{variable}", "/{a}", " = ", "{b}"], min: "{min(0, a*b)}", max: "{max(0, a*b)}", step: "{abs(b)}", labelled: [] }, caption: "{variable} cut into {a} equal parts — the line walks them end to end." }
  - t: 3.5
    patch: { eqHighlight: ["1", "3"], highlight: ["{b}"], marker: "{b}", labelled: ["0", "{b}"], jumps: { size: "{b}", count: "{a}", shown: 1, label: "{b}" } }
    caption: "One of the {a} equal parts is {b} — the first jump."
    expect:
      type: numeric
      value: "{b}"
      prompt: "{variable}/{a} = {b} — ONE of the {a} equal parts is how long?"
      hint: "The equation names it."
  - t: 7
    patch: { eqHighlight: ["0"], jumps: { size: "{b}", count: "{a}", shown: "all", label: "{b}" } }
    caption: "{a} jumps of {b}, end to end. So what is {variable}?"
    expect:
      type: op
      value: "multiply {a}"
      prompt: "ONE part is {b}, and {variable} is ALL {a} of them. What move rebuilds {variable}?"
      hint: "{a} parts, each one {b} long."
      misconceptions:
        - id: divided-instead-of-multiplied
          when: "divide {a}"
          says: "{variable} is already cut into {a} parts — dividing again makes them smaller. To rebuild the whole, multiply."
  - { t: 10.5, patch: { eqHighlight: [], marker: "{a*b}", highlight: ["{a*b}"], labelled: ["0", "{b}", "{a*b}"] }, caption: "{a} jumps of {b} reach {a*b}. {variable} = {a*b}." }
  - { t: 13, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-02 }
