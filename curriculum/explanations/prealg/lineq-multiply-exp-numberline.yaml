id: prealg.lineq.multiply.exp-numberline
skill: prealg.lineq.multiply
representation: number-line
widget: number-line
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{variable}", "/{a}", " = ", "{b}"], min: 0, max: "{a*b}", step: "{b}" , labelled: []}, caption: "Here is the problem in symbols. Watch it become jumps on a line." }
  - { t: 3.5, patch: { eqHighlight: ["1", "3"], highlight: ["{b}"], marker: "{b}" }, caption: "One of the {a} equal parts is {b}.", expect: { type: numeric, value: "{b}", prompt: "The equation says ONE part equals what? Type it." } }
  - { t: 7, patch: { eqHighlight: ["0"], marker: "{a*b}" }, caption: "{variable} is ALL {a} parts: {a} jumps of {b}. So what is {variable}?", expect: { type: op, value: "multiply {a}", prompt: "ONE part is {b}, and {variable} is ALL {a} of them. What move rebuilds {variable}?", misconceptions: [ { id: divided-instead-of-multiplied, when: "divide {a}", says: "{variable} is already cut into {a} parts — dividing again makes them smaller. To rebuild the whole, multiply." } ] } }
  - { t: 10.5, patch: { eqHighlight: [], highlight: ["{a*b}"] }, caption: "{a} parts of {b} reach {a*b}, so {variable} = {a*b}." }
  - { t: 13, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-08-27 }
