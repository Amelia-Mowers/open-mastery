id: prealg.lineq.multiply.exp-balance
skill: prealg.lineq.multiply
representation: balance-scale
widget: balance-scale
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{variable}", "/{a}", " = ", "{b}"], left: "{variable}/{a}", right: "{b}", leftIn: false, rightIn: false }, caption: "Here is the problem in symbols. Watch each piece land on the scale." }
  - { t: 4, patch: { eqHighlight: ["0", "1"], leftIn: true, highlight: left }, caption: "{variable}/{a} goes on the left pan.", expect: { type: pick, value: ["0", "1"] } }
  - { t: 8, patch: { eqHighlight: ["3"], rightIn: true, highlight: right }, caption: "{b} goes on the right pan — and the scale balances.", expect: { type: pick, value: ["3"] } }
  - { t: 12, patch: { eqHighlight: [], highlight: left }, caption: "{variable} is divided by {a}. Undo division by multiplying." }
  - { t: 15.5, patch: { op: multiply, by: "{a}", highlight: null }, caption: "Multiply both sides by {a} — the scale stays balanced.", expect: { type: op, value: "multiply {a}" } }
  - { t: 19, patch: { left: "{variable}", right: "{a*b}", op: null }, caption: "{variable} = {a*b}." }
  - { t: 21, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
