id: prealg.lineq.multiply.exp-balance
skill: prealg.lineq.multiply
representation: balance-scale
widget: balance-scale
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{variable}", "/{a}", " = ", "{b}"], left: "{variable}/{a}", right: "{b}", leftIn: false, rightIn: false }, caption: "The problem in symbols — each piece takes its place on the scale." }
  - { t: 4, patch: { eqHighlight: ["0", "1"], leftIn: true, highlight: left }, caption: "{variable}/{a} goes on the left pan.", expect: { type: pick, value: ["0", "1"], prompt: "Which piece — or pieces — of the equation go on the LEFT pan?" } }
  - { t: 8, patch: { eqHighlight: ["3"], rightIn: true, highlight: right }, caption: "{b} goes on the right pan — and the scale balances.", expect: { type: pick, value: ["3"], prompt: "Which piece — or pieces — of the equation go on the RIGHT pan?" } }
  - { t: 12, patch: { eqHighlight: [], highlight: left }, caption: "{variable} is divided by {a}." }
  - t: 15.5
    patch: { op: multiply, by: "{a}", highlight: null }
    caption: "Multiply both sides by {a} — the scale stays balanced. So what is {variable}?"
    expect:
      type: op
      value: "multiply {a}"
      misconceptions:
        - id: divided-instead-of-multiplied
          when: "divide {a}"
          says: "{variable} is already cut into {a} parts — dividing again makes them smaller. To rebuild the whole, multiply."
  - { t: 19, patch: { left: "{variable}", right: "{a*b}", op: null }, caption: "{variable} = {a*b}." }
  - { t: 21, handoff: { prompt: "Now you try." } }
review: { status: vetted, by: "@Amelia-Mowers", date: 2026-08-29 }
