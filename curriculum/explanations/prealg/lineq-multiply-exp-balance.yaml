id: prealg.lineq.multiply.exp-balance
skill: prealg.lineq.multiply
representation: balance-scale
widget: balance-scale
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{variable}/{a}", " = ", "{b}"], left: "{variable}/{a}", right: "{b}", leftIn: false, rightIn: false }, caption: "Two sides claimed equal — the scale weighs {variable}/{a} against {b}." }
  - { t: 4, patch: { eqHighlight: ["0"], leftIn: true, highlight: left }, caption: "{variable}/{a} — just one of {variable}'s {a} equal parts — sits on the left pan.", expect: { type: pick, value: ["0"], prompt: "Which piece — or pieces — of the equation go on the LEFT pan?" } }
  - { t: 8, patch: { eqHighlight: ["2"], rightIn: true, highlight: right }, caption: "= {b} says both sides weigh the SAME — {b} on the right pan, and the scale balances.", expect: { type: pick, value: ["2"], prompt: "Which piece — or pieces — of the equation go on the RIGHT pan?" } }
  - { t: 12, patch: { eqHighlight: [], highlight: left }, caption: "The pan holds {variable} divided by {a} — only one {a}th of the unknown is weighing in." }
  - t: 15.5
    patch: { op: multiply, by: "{a}", highlight: null }
    caption: "Multiply BOTH pans by {a}: both sides grow the same way, so the scale stays level. So what is {variable}?"
    expect:
      type: op
      value: "multiply {a}"
      prompt: "What do you do to BOTH pans to weigh the WHOLE {variable}?"
      misconceptions:
        - id: divided-instead-of-multiplied
          when: "divide {a}"
          says: "{variable} is already cut into {a} parts — dividing again makes them smaller. To rebuild the whole, multiply."
  - { t: 19, patch: { equation: ["{variable}", " = ", "{a*b}"], left: "{variable}", right: "{a*b}", op: null }, caption: "The whole {variable} balances {a*b}: {variable} = {a*b}." }
  - { t: 21, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-09 }
