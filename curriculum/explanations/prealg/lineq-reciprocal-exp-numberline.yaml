id: prealg.lineq.reciprocal.exp-numberline
skill: prealg.lineq.reciprocal
representation: number-line
widget: number-line
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{p}/{q}", "{variable}", " = ", "{b}"], min: 0, max: "{max(b, q*b/p)}", step: "{b/p}", labelled: [] }, caption: "{p}/{q} of {variable} — {p} of its {q} equal parts. The line lays the parts out." }
  - t: 3.5
    patch: { eqHighlight: ["0", "1"], marker: "{b}", highlight: ["{b}"], labelled: ["0", "{b}"] }
    caption: "{p}/{q} of {variable} is {b} — that is {p} of {variable}'s {q} equal parts."
    expect:
      type: numeric
      value: "{b}"
      prompt: "Where on the line does {p}/{q} of {variable} sit?"
      hint: "The equation names the landing spot."
  - t: 7.5
    patch: { eqHighlight: [], highlight: ["{b/p}"], marker: "{b/p}", labelled: ["0", "{b/p}", "{b}"], jumps: { size: "{b/p}", count: "{q}", shown: 1 } }
    caption: "So ONE part is {b} ÷ {p} = {b/p}. {variable} is {q} of those parts — so what is {variable}?"
    expect:
      type: numeric
      value: "{b/p}"
      prompt: "{b} is {p} parts together — how big is ONE part?"
      hint: "Split {b} into {p} equal pieces."
  - { t: 11.5, patch: { marker: "{q*b/p}", highlight: ["{q*b/p}"], labelled: ["0", "{b/p}", "{b}", "{q*b/p}"], jumps: { size: "{b/p}", count: "{q}", shown: "all" } }, caption: "{q} parts of {b/p}, end to end: {q} × {b/p} = {q*b/p}. {variable} = {q*b/p}." }
  - { t: 14, handoff: { prompt: "Now you try." } }
review: { status: vetted, by: "@Amelia-Mowers", date: 2026-09-02 }
