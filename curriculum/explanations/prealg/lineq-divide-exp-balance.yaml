id: prealg.lineq.divide.exp-balance
skill: prealg.lineq.divide
representation: balance-scale
widget: balance-scale
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{a}", "{variable}", " = ", "{b}"], left: "{a}{variable}", right: "{b}", leftIn: false, rightIn: false }, caption: "Two sides claimed equal — the scale weighs {a}{variable} against {b}." }
  - { t: 4, patch: { eqHighlight: ["0", "1"], leftIn: true, highlight: left }, caption: "{a}{variable} — {a} copies of the same unknown — sits together on the left pan.", expect: { type: pick, value: ["0", "1"], prompt: "Which piece — or pieces — of the equation go on the LEFT pan?" } }
  - { t: 8, patch: { eqHighlight: ["3"], rightIn: true, highlight: right }, caption: "= {b} says both sides weigh the SAME — {b} on the right pan, and the scale balances.", expect: { type: pick, value: ["3"], prompt: "Which piece — or pieces — of the equation go on the RIGHT pan?" } }
  - { t: 12, patch: { eqHighlight: [], highlight: left.coef }, caption: "The left pan holds {variable} multiplied by {a} — {a} unknowns weighing as one." }
  - t: 15.5
    patch: { op: divide, by: "{a}", highlight: null }
    caption: "Divide BOTH pans by {a}: both sides shrink the same way, so the scale stays level. So what is {variable}?"
    expect:
      type: op
      value: "divide {a}"
      prompt: "What do you do to BOTH pans to leave a single {variable}?"
      misconceptions:
        - id: subtracted-the-coefficient
          when: "subtract {a}"
          says: "{a}{variable} means {a} TIMES {variable}, not {a} plus {variable} — subtracting {a} will not free it. Undo a multiply with a divide."
        - id: multiplied-instead-of-divided
          when: "multiply {a}"
          says: "Multiplying by {a} makes it {a} times bigger still. To undo × {a}, divide."
  - { t: 19, patch: { left: "{variable}", right: "{b/a}", op: null }, caption: "One {variable} alone balances {b/a}: {variable} = {b/a}." }
  - { t: 21, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-09 }
