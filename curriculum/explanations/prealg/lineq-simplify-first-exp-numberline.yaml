id: prealg.lineq.simplify-first.exp-numberline
skill: prealg.lineq.simplify-first
representation: number-line
widget: number-line
params_from: item
timeline:
  - { t: 0, caption: "First tidy each side: {c1}{variable} + {c2}{variable} - {c3}{variable} is {c1+c2-c3} jumps of the same size." }
  - { t: 4, patch: { min: 0, max: "{(c1+c2-c3)*ans}", step: "{ans}" }, caption: "{c1+c2-c3} equal jumps land on {(c1+c2-c3)*ans}." }
  - { t: 7.5, patch: { highlight: ["{ans}"], marker: "{ans}" }, caption: "So each jump — and {variable} — is {ans}." }
  - { t: 9.5, handoff: { prompt: "Now you try." } }
