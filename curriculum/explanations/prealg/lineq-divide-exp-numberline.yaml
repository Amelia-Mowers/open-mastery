id: prealg.lineq.divide.exp-numberline
skill: prealg.lineq.divide
representation: number-line
widget: number-line
params_from: item
timeline:
  - { t: 0, patch: { min: 0, max: "{b}", step: "{b/a}" }, caption: "{a}{variable} = {b} means {a} equal jumps must land exactly on {b}." }
  - { t: 3.5, patch: { highlight: ["{b/a}"], marker: "{b/a}" }, caption: "The first jump lands on {b/a} — that is the size of every jump." }
  - { t: 7, patch: { marker: "{b}" }, caption: "After {a} equal jumps you reach {b}. So {variable} = {b/a}." }
  - { t: 9, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
