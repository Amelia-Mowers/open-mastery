id: prealg.lineq.multiply.exp-tape
skill: prealg.lineq.multiply
representation: tape-diagram
widget: tape-diagram
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{variable}", "/{a}", " = ", "{b}"], parts: "{a}", partLabel: "", total: "{variable}", totalIn: false, removed: "others" }, caption: "A tape of equal parts — the equation says how many." }
  - t: 4
    patch: { removed: [], eqHighlight: ["1"] }
    caption: "{a} equal parts — and the equation says what ONE is worth."
    expect:
      type: numeric
      value: "{a}"
      prompt: "{variable}/{a} — how many equal parts does {variable} split into?"
      hint: "The number under {variable} counts the parts."
  - t: 8
    patch: { eqHighlight: ["3"], partLabel: "{b}", highlight: ["1"] }
    caption: "Each part is {b}."
    expect:
      type: pick
      value: ["3"]
      prompt: "Which piece — or pieces — of the equation is ONE part worth?"
      hint: "The lone number after the equals sign."
  - t: 12
    patch: { eqHighlight: ["0"], totalIn: true, highlight: [] }
    caption: "All {a} parts together are the whole: {variable}."
    expect:
      type: pick
      value: ["0"]
      prompt: "Which piece — or pieces — of the equation is the WHOLE bar?"
      hint: "The unknown that the parts build."
  - t: 16
    patch: { eqHighlight: [], highlight: ["1"] }
    caption: "{a} parts of {b}, end to end. So what is {variable}?"
    expect:
      type: op
      value: "multiply {a}"
      prompt: "ONE part is {b}, and {variable} is ALL {a} of them. What move rebuilds {variable}?"
      hint: "{a} parts, each worth {b}."
      misconceptions:
        - id: divided-instead-of-multiplied
          when: "divide {a}"
          says: "{variable} is already cut into {a} parts — dividing again makes them smaller. To rebuild the whole, multiply."
  - { t: 20, patch: { total: "{a*b}", highlight: [] }, caption: "{b} × {a} = {a*b}. The whole bar — {variable} — is {a*b}." }
  - { t: 23, handoff: { prompt: "Now you try." } }
review: { status: vetted, by: "@Amelia-Mowers", date: 2026-09-01 }
