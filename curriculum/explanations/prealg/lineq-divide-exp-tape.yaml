id: prealg.lineq.divide.exp-tape
skill: prealg.lineq.divide
representation: tape-diagram
widget: tape-diagram
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{a}", "{variable}", " = ", "{b}"], parts: "{a}", partLabel: "", total: "{b}", totalIn: false, removed: "others" }, caption: "A tape of equal parts — the equation says how many." }
  - t: 4
    patch: { removed: [], eqHighlight: ["0"] }
    caption: "{a} equal parts — and the equation names what each one is."
    expect:
      type: numeric
      value: "{a}"
      prompt: "{a}{variable} — how many equal parts does the tape have?"
      hint: "The number in front of {variable} counts the parts."
  - t: 8
    patch: { eqHighlight: ["1"], partLabel: "{variable}", highlight: ["1"] }
    caption: "Each part is one {variable}."
    expect:
      type: pick
      value: ["1"]
      prompt: "Which piece — or pieces — of the equation is EACH part?"
      hint: "Every section of the tape holds the same unknown."
  - t: 12
    patch: { eqHighlight: ["3"], totalIn: true, highlight: [] }
    caption: "All {a} parts together make {b}."
    expect:
      type: pick
      value: ["3"]
      prompt: "Which piece — or pieces — of the equation tell what ALL the parts add up to?"
      hint: "The lone number after the equals sign."
  - t: 16
    patch: { eqHighlight: [], highlight: ["1"] }
    caption: "{b} shared into {a} equal parts. So what is ONE {variable}?"
    expect:
      type: op
      value: "divide {a}"
      prompt: "To find ONE part, what do you do to {b}?"
      hint: "The whole {b} is shared equally between {a} parts."
      misconceptions:
        - id: subtracted-the-coefficient
          when: "subtract {a}"
          says: "Taking {a} away from {b} is not sharing it — the tape splits {b} into {a} EQUAL parts. Undo a multiply with a divide."
        - id: multiplied-instead-of-divided
          when: "multiply {a}"
          says: "Multiplying by {a} makes the tape {a} times longer. To find ONE part, divide."
  - { t: 20, patch: { partLabel: "{variable}", total: "{b/a}", removed: "others", highlight: ["1"] }, caption: "{b} ÷ {a} = {b/a}: the tape shrinks to ONE part. One {variable} is {b/a}." }
  - { t: 23, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-01 }
