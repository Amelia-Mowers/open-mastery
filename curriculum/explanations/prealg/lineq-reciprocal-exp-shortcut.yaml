id: prealg.lineq.reciprocal.exp-shortcut
skill: prealg.lineq.reciprocal
representation: worked-equation
widget: worked-equation
params_from: item
timeline:
  - { t: 0, patch: { start: "{p}/{q} {variable} = {b}" }, caption: "The shortcut — one move instead of two." }
  - { t: 4, patch: { line: "{q}/{p} · {p}/{q} {variable} = {q}/{p} · {b}", note: "the same move on both sides" }, caption: "× {q}/{p} on both sides — {p}/{q} flipped over.", expect: { type: op, value: "multiply {q}/{p}", prompt: "{p}/{q} is in the way. What ONE factor on both sides turns it into 1?", hint: "A fraction times its reciprocal is 1. The reciprocal of {p}/{q} is {q}/{p}." } }
  - { t: 9, patch: { line: "1{variable} = {q*b/p}", note: "reciprocals multiply to 1" }, caption: "A fraction times its reciprocal is 1 — the left side collapses to 1{variable}. So what is {variable}?", expect: { type: expr, value: "1{variable} = {q*b/p}", prompt: "The left collapses to 1{variable}. What does {q}/{p} · {b} work out to?", hint: "{q} × {b} ÷ {p}." } }
  - { t: 13, patch: { line: "{variable} = {q*b/p}" }, caption: "{variable} = {q*b/p}. Fewer steps — once the flip feels natural." }
  - { t: 15.5, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
