id: g6.rp.unit-rate.exp-tape
skill: g6.rp.unit-rate
representation: tape-diagram
widget: tape-diagram
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{a} pounds", " → ", "${b}", ",  1 pound → $?"], parts: "{a}", partLabel: "", total: "${b}", totalIn: false, removed: "others" }, caption: "The cost will cut into equal pieces — one per pound." }
  - t: 4
    patch: { removed: [], eqHighlight: ["0"] }
    caption: "{a} pounds — {a} equal pieces, one pound each."
    expect:
      type: numeric
      value: "{a}"
      prompt: "One piece per pound — how many equal pieces does the cost cut into?"
      hint: "Count the pounds."
  - t: 8
    patch: { eqHighlight: ["3"], partLabel: "$?", highlight: ["1"] }
    caption: "Each piece is one pound's cost — the $? we are after."
    expect:
      type: pick
      value: ["3"]
      prompt: "Which piece — or pieces — of the line is EACH piece of the tape worth?"
      hint: "Every piece holds ONE pound's cost."
  - t: 12
    patch: { eqHighlight: ["2"], totalIn: true, highlight: [] }
    caption: "All the pieces together cost ${b}."
    expect:
      type: pick
      value: ["2"]
      prompt: "Which piece — or pieces — tell what the WHOLE tape costs?"
      hint: "The full price of all {a} pounds."
  - t: 16
    patch: { eqHighlight: [], highlight: ["1"] }
    caption: "${b} shared into {a} equal pieces. So what does ONE pound cost?"
    expect:
      type: op
      value: "divide {a}"
      prompt: "To find ONE pound's piece, what do you do to the ${b}?"
      hint: "Share ${b} equally among the {a} pounds."
      misconceptions:
        - id: multiplied-instead-of-divided
          when: "multiply {a}"
          says: "Multiplying by {a} prices {a} pounds of {a} pounds — ONE pound is a SHARE of the ${b}: divide."
  - { t: 20, patch: { partLabel: "1 pound", total: "${b/a}", removed: "others", highlight: ["1"] }, caption: "${b} ÷ {a} = ${b/a}: one piece — ONE pound — costs ${b/a}. That is the unit rate." }
  - { t: 23, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-01 }
