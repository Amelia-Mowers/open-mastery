id: g7.rp.test-proportional.exp-table
skill: g7.rp.test-proportional
representation: ratio-table
widget: ratio-table
params_from: item
timeline:
  - { t: 0, patch: { equation: ["y", " ÷ ", "x", " = same?" ], cols: ["x", "y"], rows: [["{a}", "{a*k}"], ["{c}", "{c*k}"], ["{e}", "{e*k}"]], reveal: "1" }, caption: "Is this table proportional? ONE test decides: y ÷ x, row by row." }
  - t: 4
    patch: { eqHighlight: ["0", "2"], reveal: "2", highlight: "2" }
    caption: "Row 1 gives {k}. Row two: {c*k} ÷ {c} = {k} — the SAME so far."
    expect:
      type: numeric
      value: "{k}"
      prompt: "Row 1 first — what is its y divided by its x?"
      hint: "{a*k} ÷ {a}."
  - { t: 8, patch: { eqHighlight: [], reveal: "3", highlight: "3" }, caption: "Row three: {e} and {e*k} — the last check before the verdict." }
  - { t: 12, patch: { eqHighlight: ["3"], highlight: null }, caption: "{e*k} ÷ {e} = {k}. Same in EVERY row → proportional, with k = {k}." }
  - { t: 16, patch: { eqHighlight: [], cols: ["x", "y"], rows: [["{a}", "{a*k}"], ["{c}", "{c*k+c}"], ["{e}", "{e*k}"]], reveal: "2", highlight: "2" }, caption: "Now a DIFFERENT table, same test. Row 1 still gives {k} — does the changed row 2?" }
  - t: 20
    patch: { reveal: "2", highlight: "2" }
    caption: "{c*k+c} ÷ {c} = {k+1}, not {k} — ONE different row breaks it: NOT proportional."
    expect:
      type: numeric
      value: "{k+1}"
      prompt: "The changed row — what is its y divided by its x?"
      hint: "{c*k+c} ÷ {c}."
  - { t: 24, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-09 }
