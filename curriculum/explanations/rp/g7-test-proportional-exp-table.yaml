id: g7.rp.test-proportional.exp-table
skill: g7.rp.test-proportional
representation: ratio-table
widget: ratio-table
params_from: item
timeline:
  - { t: 0, patch: { equation: ["y", " ÷ ", "x", " = same?" ], cols: ["x", "y"], rows: [["{a}", "{a*k}"], ["{c}", "{c*k}"], ["{e}", "{e*k}"]], reveal: "0" }, caption: "Is this table proportional? There is ONE test." }
  - { t: 4, patch: { eqHighlight: ["0", "2"], reveal: "3" }, caption: "Divide y by x in every row.", expect: { type: numeric, value: "{e*k}", prompt: "What goes in the next row?" } }
  - { t: 8, patch: { eqHighlight: [], highlight: "1" }, caption: "First row: {a*k} ÷ {a}. Hold that number in mind. Does the next row divide to the same thing?" }
  - { t: 12, patch: { highlight: "2" }, caption: "So the question the table asks is: does the LAST row divide to the same number too?", expect: { type: numeric, value: "{k}", prompt: "{c*k} ÷ {c} — what do you get?", hint: "The same quotient as the row above, if it is proportional." } }
  - { t: 16, patch: { highlight: "3" }, caption: "{e*k} ÷ {e} = {k}. Same in EVERY row → proportional, with k = {k}." }
  - { t: 19.5, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
