id: g6.rp.percent-of.exp-worked
skill: g6.rp.percent-of
representation: worked-equation
widget: worked-equation
params_from: item
timeline:
  - { t: 0, patch: { start: "{100/n}% of {n*w}" }, caption: "Percent means out of every 100 — and a benchmark percent IS a fraction." }
  - { t: 4, patch: { line: "{100/n}% = 1/{n}", note: "benchmark fraction" }, caption: "{100/n}% IS 1/{n}: one of {n} equal parts of {n*w}. What move takes one part?", expect: { type: numeric, value: "{n}", prompt: "{100/n}% means one part out of how many equal parts?", hint: "100 ÷ {100/n}." } }
  - { t: 8.5, patch: { line: "1/{n} of {n*w} = {n*w} ÷ {n}", note: "one part of {n}" }, caption: "One of {n} equal parts. So what is {100/n}% of {n*w}?", expect: { type: op, value: "divide {n}", prompt: "1/{n} of {n*w} — what move takes one part?" } }
  - { t: 12, patch: { line: "= {w}", note: "the part" }, caption: "{100/n}% of {n*w} is {w}." }
  - { t: 14.5, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-08-30 }
