  - { t: 8.5, patch: { line: "{5*f}% = {f} × {g} = {f*g}", note: "{f} fives" }, caption: "{5*f}% is {f} of those fives: {f*g}.", expect: { type: numeric, value: "{f*g}", prompt: "What number finishes this line?" } }
