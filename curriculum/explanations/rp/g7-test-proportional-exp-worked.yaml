id: g7.rp.test-proportional.exp-worked
skill: g7.rp.test-proportional
representation: worked-equation
widget: worked-equation
params_from: item
timeline:
  - { t: 0, patch: { start: "is y proportional to x?", line: ["x = {a}, y = {a*k}", "x = {c}, y = {c*k}", "x = {e}, y = {e*k}"] }, caption: "Proportional means ONE constant multiplies every x. The test: y ÷ x, every pair." }
  - { t: 4, patch: { line: "{a*k} ÷ {a} = {k}", note: "y ÷ x, the first pair" }, caption: "The first pair gives {k}. Do the other pairs match?", expect: { type: numeric, value: "{k}", prompt: "{a*k} ÷ {a} — what does the first pair give?", hint: "y ÷ x." } }
  - { t: 8, patch: { line: "{c*k} ÷ {c} = {k}", note: "the second pair" }, caption: "The second pair matches. And the last one — {e*k} ÷ {e}?" }
  - { t: 12, patch: { line: ["{e*k} ÷ {e} = {k}", "proportional: y = {k}x"], note: "every pair, one constant" }, caption: "The same quotient in every pair — proportional, and the rule is y = {k}x." }
  - { t: 15.5, handoff: { prompt: "Now you try." } }
review: { status: vetted, by: "@Amelia-Mowers", date: 2026-08-30 }
