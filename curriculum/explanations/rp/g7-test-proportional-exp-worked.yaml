id: g7.rp.test-proportional.exp-worked
skill: g7.rp.test-proportional
representation: worked-equation
widget: worked-equation
params_from: item
timeline:
  - { t: 0, patch: { start: "Is y proportional to x?", line: ["x = {a}, y = {a*k}", "x = {c}, y = {c*k}", "x = {e}, y = {e*k}"] }, caption: "Three pairs on the board, one claim to check: one constant should fit every pair." }
  - { t: 4, patch: { line: "{a*k} ÷ {a} = {k}", note: "y ÷ x, the first pair", mark: "÷ {a} = {k}" }, caption: "The first pair gives {k} — the candidate constant. Every other pair must match it.", expect: { type: numeric, value: "{k}", prompt: "What does the first pair give — its y divided by its x?", hint: "{a*k} ÷ {a}." } }
  - { t: 8, patch: { line: "{c*k} ÷ {c} = {k}", note: "the second pair", mark: ["÷ {a} = {k}", "÷ {c} = {k}"] }, caption: "The second pair matches — one pair left to check." }
  - { t: 12, patch: { line: ["{e*k} ÷ {e} = {k}", "proportional: y = {k}x"], note: "every pair, one constant", mark: ["÷ {a} = {k}", "÷ {c} = {k}", "÷ {e} = {k}"] }, caption: "The same answer in every pair — proportional, and the rule is y = {k}x." }
  - { t: 16, patch: { line: ["now a DIFFERENT table:", "x = {a}, y = {a*k}", "x = {c}, y = {c*k+c}"], note: "same test", mark: null }, caption: "A new table, same test. The first pair still gives {k} — does the second?" }
  - t: 20
    patch: { line: "{c*k+c} ÷ {c} = {k+1} — not {k}", mark: "{k+1} — not {k}" }
    caption: "{k+1}, not {k} — ONE different answer breaks it: this table is NOT proportional."
    expect:
      type: numeric
      value: "{k+1}"
      prompt: "The new second pair — what is its y divided by its x?"
      hint: "{c*k+c} ÷ {c}."
  - { t: 24, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-09 }
