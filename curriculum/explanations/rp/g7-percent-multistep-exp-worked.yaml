id: g7.rp.percent-multistep.exp-worked
skill: g7.rp.percent-multistep
representation: worked-equation
widget: worked-equation
params_from: item
timeline:
  - { t: 0, patch: { start: "${n*p} at {100/n}% off" }, caption: "Two steps: find the discount, then subtract it." }
  - { t: 4, patch: { line: "discount = {n*p} ÷ {n}", note: "1/{n} of the price" }, caption: "That is the discount — what you save.", expect: { type: numeric, value: "{p}", prompt: "{100/n}% is 1/{n} — what is 1/{n} of ${n*p}?", hint: "{n*p} ÷ {n}." } }
  - { t: 6.5, patch: { line: "discount = {p}", note: "what you save" }, caption: "The discount is ${p}." }
  - { t: 8.5, patch: { line: "sale price = {n*p} − {p}", note: "the discount comes off" }, caption: "The discount comes off the full price. So what do you actually pay?" }
  - { t: 12, patch: { line: "sale price = {n*p - p}", note: "the rest" }, caption: "You pay ${n*p - p}." }
  - { t: 14.5, handoff: { prompt: "Now you try." } }
review: { status: vetted, by: "@Amelia-Mowers", date: 2026-08-30 }
