id: g6.rp.compare-rates.exp-numberline
skill: g6.rp.compare-rates
representation: number-line
widget: number-line
params_from: item
timeline:
  - { t: 0, patch: { equation: ["A: {a1} pencils, ${u*a1}", "  vs  ", "B: {a2} pencils, ${(u+d)*a2}", " — better buy?"], min: 0, max: "{max(u*a1, (u+d)*a2)}", step: "{max(u*a1, (u+d)*a2)}", labelled: [] }, caption: "Two offers on one line — A above, B below. Whole prices first." }
  - t: 4
    patch: { eqHighlight: ["0"], jumps: { size: "{u*a1}", count: 1, label: "A: ${u*a1}" } }
    caption: "Offer A, whole: one span of ${u*a1}, above the line."
    expect:
      type: pick
      value: ["0"]
      prompt: "Which piece — or pieces — is the WHOLE of offer A?"
      hint: "Everything A gives and costs, in one piece."
  - t: 8
    patch: { eqHighlight: ["2"], jumps: [{ size: "{u*a1}", count: 1, label: "A: ${u*a1}" }, { size: "{(u+d)*a2}", count: 1, label: "B: ${(u+d)*a2}", color: "#3f6a4d", below: true }] }
    caption: "Offer B, whole: one span of ${(u+d)*a2}, below the line."
    expect:
      type: pick
      value: ["2"]
      prompt: "Which piece — or pieces — is the WHOLE of offer B?"
      hint: "Everything B gives and costs, in one piece."
  - t: 12
    patch: { eqHighlight: ["0"], jumps: [{ size: "{u}", count: "{a1}" }, { size: "{(u+d)*a2}", count: 1, label: "B: ${(u+d)*a2}", color: "#3f6a4d", below: true }] }
    caption: "A's span cuts into {a1} equal pieces — one per pencil."
    expect:
      type: numeric
      value: "{a1}"
      prompt: "How many equal pieces does A's span cut into?"
      hint: "One piece per pencil in the pack."
  - t: 16
    patch: { eqHighlight: ["2"], jumps: [{ size: "{u}", count: "{a1}" }, { size: "{u+d}", count: "{a2}", color: "#3f6a4d", below: true }] }
    caption: "B's span cuts into {a2} equal pieces the same way."
    expect:
      type: numeric
      value: "{a2}"
      prompt: "How many equal pieces does B's span cut into?"
      hint: "One piece per pencil in the pack."
  - t: 20
    patch: { eqHighlight: ["3"], axis: { min: 0, max: "{u+d}", step: "{gcd(u, d)}" }, jumps: [{ size: "{u}", count: 1 }, { size: "{u+d}", count: 1, color: "#3f6a4d", below: true }], labelled: [] }
    caption: "Keep just the FIRST piece of each and zoom IN: ONE pencil against ONE pencil. So which pack is the better buy?"
  - { t: 24, patch: { jumps: [{ size: "{u}", count: 1, label: "A: ${u}" }, { size: "{u+d}", count: 1, label: "B: ${u+d}", color: "#3f6a4d", below: true }], labelled: ["{u}", "{u+d}"] }, caption: "ONE Pack-A pencil: ${u}. ONE Pack-B pencil: ${u+d}. The shorter piece costs less — A is the better buy." }
  - { t: 27, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-02 }
