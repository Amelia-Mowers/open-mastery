id: g6.rp.unit-rate.exp-worked
skill: g6.rp.unit-rate
representation: worked-equation
widget: worked-equation
params_from: item
timeline:
  - { t: 0, patch: { start: "{a} pounds cost ${b}", line: "1 pound costs $?" }, caption: "All {a} pounds together cost ${b} — just ONE of them is the unknown." }
  - { t: 4, patch: { line: "1 pound costs ${b} ÷ {a}", note: "share equally", mark: "${b} ÷ {a}" }, caption: "An equal share of the ${b}. So what does ONE pound cost?", expect: { type: op, value: "divide {a}", sides: false, prompt: "To find ONE pound's price, what do you do to the ${b}?", hint: "Share ${b} equally among the {a} pounds.", misconceptions: [{ id: "multiplied-instead-of-divided", when: "multiply {a}", says: "Multiplying by {a} prices {a} pounds of {a} pounds — ONE pound is a SHARE of the ${b}: divide." }] } }
  - { t: 8, patch: { line: "unit rate = ${b/a} per pound", note: "{b} ÷ {a} = {b/a}", mark: null }, caption: "${b/a} for one pound — the price for one is the unit rate." }
  - { t: 10.5, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-09 }
