id: g6.rp.find-whole.exp-table
skill: g6.rp.find-whole
representation: ratio-table
widget: ratio-table
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{100/n}%", " of ? = ", "{k}"], cols: ["percent", "amount"], rows: [["{100/n}%", "{k}"], ["100%", "{n*k}"]], reveal: "0" }, caption: "The KNOWN row is a benchmark part — the whole hides at 100%." }
  - { t: 4, patch: { eqHighlight: ["0", "1"], reveal: "1", highlight: "1" }, caption: "{100/n}% of the number is {k} — and {100/n}% is 1/{n}. How many such parts make the whole?" }
  - { t: 8.5, patch: { eqHighlight: [], highlight: "2", factor: { from: "1", to: "2", text: "×{n}" } }, caption: "×{n} climbs from 1/{n} to the whole. So what is the WHOLE?", expect: { type: numeric, value: "{n}", prompt: "1/{n} of the number, times what, gives the whole?", hint: "All {n} parts." } }
  - { t: 13, patch: { reveal: "2", highlight: "2" }, caption: "100% = {n} × {k} = {n*k}. The number is {n*k}." }
  - { t: 16, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-08-30 }
