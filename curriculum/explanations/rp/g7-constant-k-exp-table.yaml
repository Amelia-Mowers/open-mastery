id: g7.rp.constant-k.exp-table
skill: g7.rp.constant-k
representation: ratio-table
widget: ratio-table
params_from: item
timeline:
  - { t: 0, patch: { equation: ["y", " = k · ", "x", ",  k = ?"], cols: ["x", "y"], rows: [["{a}", "{a*k}"], ["{c}", "{c*k}"], ["1", "{k}"]], reveal: "1" }, caption: "y = k · x: ONE number k turns every x into its y." }
  - { t: 4, patch: { eqHighlight: ["1"], highlight: "1" }, caption: "Row 1: k turned {a} into {a*k}." }
  - t: 8
    patch: { reveal: "2", highlight: "2" }
    caption: "÷ {a} frees it: k = {a*k} ÷ {a}. Row 2 agrees — {c*k} ÷ {c} lands on the SAME number. So what is k?"
    expect:
      type: op
      value: "divide {a}"
      prompt: "k · {a} = {a*k}. To get k back out of the {a*k}, what do you do?"
      hint: "Undo the × {a}."
      misconceptions:
        - id: multiplied-instead-of-divided
          when: "multiply {a}"
          says: "× {a} is the move k already made — it built {a*k} FROM k. To get k back, undo it: divide."
  - { t: 12, patch: { eqHighlight: [], reveal: "3", highlight: "3" }, caption: "k = {k} — the y when x is 1. y = {k}x fits every row." }
  - { t: 15, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-01 }
