id: g7.rp.equation.exp-table
skill: g7.rp.equation
representation: ratio-table
widget: ratio-table
params_from: item
timeline:
  - { t: 0, patch: { equation: ["y", " = ", "{k}", "x", ",  y = ? when x = {c}"], cols: ["x", "y"], rows: [["1", "{k}"], ["{a}", "{a*k}"], ["{c}", "{c*k}"]], reveal: "0" }, caption: "The rule y = {k}x — and the question: y when x = {c}. Start where x is simplest: x = 1." }
  - t: 4
    patch: { eqHighlight: ["2"], reveal: "1", highlight: "1" }
    caption: "x = 1 gives y = {k} — that is k itself."
    expect:
      type: numeric
      value: "{k}"
      prompt: "y = {k}x — when x is 1, what is y?"
      hint: "{k} × 1."
  - t: 8
    patch: { reveal: "2", highlight: "2", factor: { from: "1", to: "2", text: "×{a}" } }
    caption: "x = {a}: y = {a*k}. Now the row the question asks about — x = {c}. What does y = {k}x give?"
    expect:
      type: numeric
      value: "{a*k}"
      prompt: "y is {k} × x. For x = {a}, what is y?"
      hint: "{k} × {a}."
  - { t: 12, patch: { eqHighlight: [], reveal: "3", highlight: "3", factor: { from: "1", to: "3", text: "×{c}" } }, caption: "x = {c}: y = {k} × {c} = {c*k}. Every row obeys y = {k}x." }
  - { t: 15, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-01 }
