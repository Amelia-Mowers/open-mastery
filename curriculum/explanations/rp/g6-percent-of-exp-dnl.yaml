id: g6.rp.percent-of.exp-dnl
skill: g6.rp.percent-of
representation: double-number-line
widget: double-number-line
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{100/n}%", " of ", "{n*w}"], topLabel: "percent", bottomLabel: "amount", top: ["0%", "{100/n}%", "100%"], bottom: ["0", "{w}", "{n*w}"], topIn: false, bottomIn: false, reveal: ["0"] }, caption: "A percent problem is a ratio problem: percent rides the top line, amount sits below." }
  - { t: 4.5, patch: { eqHighlight: ["0"], topIn: true, reveal: ["0", "2"] }, caption: "The percent line runs 0% to 100%.", expect: { type: pick, value: ["0"], prompt: "Which piece — or pieces — belong on the TOP line?" } }
  - { t: 9, patch: { eqHighlight: ["2"], bottomIn: true }, caption: "100% lines up with the whole: {n*w}. And {100/n}% is one benchmark part of the line.", expect: { type: pick, value: ["2"], prompt: "Which piece — or pieces — belong on the BOTTOM line?" } }
  - { t: 13.5, patch: { eqHighlight: [], highlight: "1" }, caption: "One of {n} equal parts of the line. So what is {100/n}% of {n*w}?", expect: { type: numeric, value: "{n}", prompt: "{100/n}% fits into 100% how many times?", hint: "100 ÷ {100/n}." } }
  - { t: 18, patch: { reveal: ["0", "1", "2"] }, caption: "{n*w} ÷ {n} = {w}: that is {100/n}% of {n*w}." }
  - { t: 21, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-01 }
