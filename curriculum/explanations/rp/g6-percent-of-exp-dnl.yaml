id: g6.rp.percent-of.exp-dnl
skill: g6.rp.percent-of
representation: double-number-line
widget: double-number-line
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{5*f}%", " of ", "{20*g}"], topLabel: "percent", bottomLabel: "amount", top: ["0%", "5%", "{5*f}%", "100%"], bottom: ["0", "{g}", "{f*g}", "{20*g}"], topIn: false, bottomIn: false, reveal: ["0"] }, caption: "A percent problem is a ratio problem: percent on one line, amount on the other." }
  - { t: 4.5, patch: { eqHighlight: ["0"], topIn: true, reveal: ["0", "3"] }, caption: "The percent line runs 0% to 100%.", expect: { type: pick, value: ["0"] } }
  - { t: 9, patch: { eqHighlight: ["2"], bottomIn: true }, caption: "100% lines up with the whole: {20*g}.", expect: { type: pick, value: ["2"] } }
  - { t: 13.5, patch: { eqHighlight: [], highlight: "1", reveal: ["0", "1", "3"] }, caption: "5% is one twentieth: {20*g} ÷ 20 = {g}." }
  - { t: 18, patch: { highlight: "2", reveal: ["0", "1", "2", "3"] }, caption: "{5*f}% is {f} fives: {f} × {g} = {f*g}." }
  - { t: 21, handoff: { prompt: "Now you try." } }
