id: g7.rp.constant-k.exp-worked
skill: g7.rp.constant-k
representation: worked-equation
widget: worked-equation
params_from: item
timeline:
  - { t: 0, patch: { start: "x: {a} → y: {a*k}" }, caption: "Proportional means y is always the same multiple of x." }
  - { t: 4, patch: { line: "k = {a*k} ÷ {a}", note: "y ÷ x, this row's numbers" }, caption: "Divide y by x to expose the multiple. So what is k?", expect: { type: numeric, value: "{k}", prompt: "k is y ÷ x. What is it for this row?" } }
  - { t: 8.5, patch: { line: "k = {k}", note: "the constant of proportionality" }, caption: "k = {k} — every x is multiplied by {k}." }
  - { t: 11, handoff: { prompt: "Now you try." } }
