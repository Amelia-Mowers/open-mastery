params_from: item
timeline:
  - { t: 0, patch: { start: "x: {a} → y: {a*k}" }, caption: "Proportional means y is always the same multiple of x." }
  - { t: 4, patch: { line: "k = y ÷ x = {a*k} ÷ {a}", note: "same for every row" }, caption: "Divide y by x to expose the multiple.", expect: { type: expr, value: "k = {a*k} / {a}" } }
  - { t: 8.5, patch: { line: "k = {k}", note: "the constant of proportionality" }, caption: "k = {k} — every x is multiplied by {k}.", expect: { type: expr, value: "k = {k}" } }
  - { t: 11, handoff: { prompt: "Now you try." } }
