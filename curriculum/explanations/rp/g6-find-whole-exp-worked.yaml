id: g6.rp.find-whole.exp-worked
skill: g6.rp.find-whole
representation: worked-equation
widget: worked-equation
params_from: item
timeline:
  - { t: 0, patch: { start: "{100/n}% of ? = {k}" }, caption: "Work backwards from the part — and read the percent as a FRACTION." }
  - { t: 4, patch: { line: "{100/n}% = 1/{n}", note: "benchmark fraction" }, caption: "{100/n}% IS 1/{n}: the number is cut into {n} equal parts, and {k} is ONE of them. What move rebuilds the whole?", expect: { type: numeric, value: "{n}", prompt: "{100/n}% means one part out of how many equal parts?", hint: "100 ÷ {100/n}." } }
  - { t: 8.5, patch: { line: "? = {k} × {n}", note: "the same part, {n} times" }, caption: "All {n} parts together. So what is the WHOLE?", expect: { type: op, value: "multiply {n}", prompt: "{k} is ONE of {n} equal parts. What move rebuilds the whole?" } }
  - { t: 12, patch: { line: "? = {n*k}", note: "the whole" }, caption: "One part is {k}; {n} parts make {n*k}." }
  - { t: 14.5, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-08-30 }
