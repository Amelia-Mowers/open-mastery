id: g6.rp.percent-of.exp-table
skill: g6.rp.percent-of
representation: ratio-table
widget: ratio-table
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{100/n}%", " of ", "{n*w}"], cols: ["percent", "amount"], rows: [["100%", "{n*w}"], ["{100/n}%", "{w}"]], reveal: "0" }, caption: "Percent rows are ratio rows: percent beside amount." }
  - { t: 4, patch: { eqHighlight: ["2"], reveal: "1", highlight: "1" }, caption: "100% is the whole thing: {n*w}. {100/n}% is one small benchmark part of it — how do you step down to it?" }
  - { t: 8.5, patch: { eqHighlight: [], highlight: "2", factor: { from: "1", to: "2", text: "÷{n}" } }, caption: "One benchmark step down from the whole. So what is {100/n}% of {n*w}?", expect: { type: numeric, value: "{n}", prompt: "The whole splits into how many equal parts?", hint: "{100/n}% is one part of the whole." } }
  - { t: 13, patch: { reveal: "2", highlight: "2" }, caption: "{100/n}% of {n*w} = {w}." }
  - { t: 16, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-08-30 }
