id: g6.rp.percent-of.exp-table
skill: g6.rp.percent-of
representation: ratio-table
widget: ratio-table
params_from: item
timeline:
  - { t: 0, patch: { equation: ["{100/n}%", " of ", "{n*w}"], cols: ["percent", "amount"], rows: [["100%", "{n*w}"], ["{100/n}%", "{w}"]], reveal: "0" }, caption: "Percent rows are ratio rows: percent beside amount." }
  - t: 4
    patch: { eqHighlight: ["2"], reveal: "1", highlight: "1" }
    caption: "100% is the whole: {n*w}. {100/n}% is ONE of its equal benchmark parts."
    expect:
      type: pick
      value: ["2"]
      prompt: "Which piece — or pieces — is the WHOLE the table starts from?"
  - t: 8
    patch: { eqHighlight: ["0"], factor: { from: "1", to: "2", text: "{n} parts" } }
    caption: "{n} equal parts sit below the whole."
    expect:
      type: numeric
      value: "{n}"
      prompt: "{n*w} splits into how many {100/n}% parts?"
      hint: "100 ÷ {100/n}."
  - t: 12
    patch: { eqHighlight: [], factor: { from: "1", to: "2", text: "÷{n}" } }
    caption: "÷{n} lands on the benchmark part. So what is {100/n}% of {n*w}?"
    expect:
      type: op
      value: "divide {n}"
      prompt: "To land on ONE {100/n}% part, what do you do to the {n*w}?"
      hint: "One part out of {n} equal parts."
      misconceptions:
        - id: multiplied-instead-of-divided
          when: "multiply {n}"
          says: "×{n} builds {n} wholes — {100/n}% is one PART of the whole: divide."
  - { t: 16, patch: { reveal: "2", highlight: "2" }, caption: "{100/n}% of {n*w} = {w}." }
  - { t: 19, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-02 }
