id: g7.rp.percent-multistep.exp-dnl
skill: g7.rp.percent-multistep
representation: double-number-line
widget: double-number-line
params_from: item
timeline:
  - { t: 0, patch: { equation: ["${20*g}", " at ", "{5*f}% off"], topLabel: "percent", bottomLabel: "dollars", top: ["0%", "{5*f}%", "{100 - 5*f}%", "100%"], bottom: ["0", "{f*g}", "{20*g - f*g}", "{20*g}"], topIn: false, bottomIn: false, reveal: ["0"] }, caption: "The sale price lives on the percent line too." }
  - { t: 4.5, patch: { eqHighlight: ["0"], topIn: true, bottomIn: true, reveal: ["0", "3"] }, caption: "100% is the full price: ${20*g}.", expect: { type: pick, value: ["0"], prompt: "Which piece — or pieces — of the ratio pair up across the two lines?" } }
  - { t: 9, patch: { eqHighlight: ["2"], highlight: "1", reveal: ["0", "1", "3"] }, caption: "So the question the lines ask is: ${f*g} comes OFF — what is left to pay?", expect: { type: numeric, value: "{f*g}", prompt: "How much is the {5*f}% discount worth?", hint: "One 5% step is ${g}, and there are {f} of them." } }
  - { t: 13.5, patch: { eqHighlight: [], highlight: "2", reveal: ["0", "1", "2", "3"] }, caption: "What you PAY is the rest: {100 - 5*f}% = ${20*g - f*g}." }
  - { t: 17, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-08-26 }
