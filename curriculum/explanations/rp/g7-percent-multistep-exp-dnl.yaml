id: g7.rp.percent-multistep.exp-dnl
skill: g7.rp.percent-multistep
representation: double-number-line
widget: double-number-line
params_from: item
timeline:
  - { t: 0, patch: { equation: ["${n*p}", " at ", "{100/n}% off", ",  you pay $?"], topLabel: "percent", bottomLabel: "dollars", top: ["0%", "{100/n}%", "{100 - 100/n}%", "100%"], bottom: ["0", "{p}", "{n*p - p}", "{n*p}"], topIn: false, bottomIn: false, reveal: ["0"] }, caption: "A {100/n}%-off deal: the percents on one line, the dollars below." }
  - t: 4.5
    patch: { eqHighlight: ["0"], topIn: true, bottomIn: true, reveal: ["0", "3"] }
    caption: "100% is the full price: ${n*p}."
    expect:
      type: pick
      value: ["0"]
      prompt: "Which piece — or pieces — of the deal is the FULL 100% price?"
      hint: "The whole price, before any discount."
  - t: 9
    patch: { eqHighlight: ["2"], highlight: "1", reveal: ["0", "1", "3"] }
    caption: "${p} comes OFF — what is left is the rest of the line. So what do you pay?"
    expect:
      type: numeric
      value: "{p}"
      prompt: "How many dollars does the {100/n}% discount take off the ${n*p}?"
      hint: "{100/n}% is 1/{n} of the price — {n*p} ÷ {n}."
  - { t: 13.5, patch: { eqHighlight: [], highlight: "2", reveal: ["0", "1", "2", "3"] }, caption: "What you PAY is the rest: {100 - 100/n}% of the price — ${n*p - p}." }
  - { t: 17, handoff: { prompt: "Now you try." } }
review: { status: draft, by: "@claude-fable-5", date: 2026-09-01 }
